<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetControl</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --border-color: #1f2937;
            --accent: #00e676;
            --accent-hover: #00c853;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE LOGIN */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .login-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border-radius: 14px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3);
        }

        .login-box h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .login-box p {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-control {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }

        /* APLICATIVO PRINCIPAL */
        #app-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            font-size: 14px;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-role-badge {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 230, 118, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        main {
            flex: 1;
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN (Sem as frases no rodapé) -->
    <div id="login-screen">
        <div class="login-box">
            <div class="login-logo">BC</div>
            <h1>BetControl</h1>
            <p>Gestão Operacional Segura</p>
            
            <form onsubmit="fazerLogin(event)">
                <div class="input-group">
                    <label>Usuário de Acesso</label>
                    <input type="text" id="login-user" class="input-control" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Senha de Segurança</label>
                    <input type="password" id="login-pass" class="input-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Acessar Sistema</button>
                <div id="login-erro" class="error-message">Usuário ou senha incorretos.</div>
            </form>
        </div>
    </div>

    <!-- TELA DO SISTEMA -->
    <div id="app-screen">
        <header>
            <div class="brand">
                <div class="brand-logo">BC</div>
                <h2 style="font-size: 16px; font-weight: 700;">BetControl</h2>
            </div>
            <div class="user-panel">
                <span id="badge-perfil" class="user-role-badge">Admin</span>
                <button class="btn-logout" onclick="fazerLogout()">Sair</button>
            </div>
        </header>

        <main>
            <h2 style="margin-bottom: 20px;">Painel de Controle</h2>
            <p style="color: var(--text-muted);">Bem-vindo ao seu sistema de gestão de apostas.</p>
        </main>
    </div>

    <script>
        const credenciais = {
            'admin': { senha: '123456', perfil: 'Admin' },
            'operador': { senha: '123456', perfil: 'Leitura' }
        };

        window.onload = function() {
            if (sessionStorage.getItem('bc_logado') === 'true') {
                mostrarApp();
            }
        };

        function fazerLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            if (credenciais[u] && credenciais[u].senha === p) {
                sessionStorage.setItem('bc_logado', 'true');
                sessionStorage.setItem('bc_perfil', credenciais[u].perfil);
                mostrarApp();
            } else {
                document.getElementById('login-erro').style.display = 'block';
            }
        }

        function fazerLogout() {
            sessionStorage.clear();
            location.reload();
        }

        function mostrarApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            document.getElementById('badge-perfil').innerText = sessionStorage.getItem('bc_perfil') || 'Admin';
        }
    </script>
</body>
</html>
