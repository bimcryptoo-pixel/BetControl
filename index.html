<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/webp" href="logo.webp">
  <title>BetControl - Gestão Operacional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuração Dinâmica do Tailwind com Temas -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: 'var(--color-base)',
            panel: 'var(--color-panel)',
            panelAlt: 'var(--color-panel-alt)',
            input: 'var(--color-input)',
            texto: 'var(--color-text)',
            mutado: 'var(--color-text-muted)',
            linha: 'var(--color-border)',
          }
        }
      }
    }
  </script>

  <!-- Supabase JS Client & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* TEMAS DE CORES */
    :root, [data-theme="dark"] {
      --color-base: #0a0f0c;
      --color-panel: #0f1a13;
      --color-panel-alt: #142219;
      --color-input: #17271c;
      --color-text: #ffffff;
      --color-text-muted: #9ca3af;
      --color-border: rgba(212, 175, 55, 0.12);
    }
    [data-theme="light"] {
      --color-base: #f3f4f6;
      --color-panel: #ffffff;
      --color-panel-alt: #f9fafb;
      --color-input: #e5e7eb;
      --color-text: #111827;
      --color-text-muted: #4b5563;
      --color-border: rgba(0, 0, 0, 0.15);
    }
    [data-theme="medium"] {
      --color-base: #1e293b;
      --color-panel: #334155;
      --color-panel-alt: #475569;
      --color-input: #0f172a;
      --color-text: #f8fafc;
      --color-text-muted: #cbd5e1;
      --color-border: rgba(255, 255, 255, 0.15);
    }

    /* ===== TEMA CASINO PREMIUM: dourado como cor de marca ===== */
    /* Botões de ação (todos os bg-emerald-600/500 do app são botões de marca) */
    .bg-emerald-600 { background-color: #c9a227 !important; color: #1a1405 !important; }
    .bg-emerald-500 { background-color: #d4af37 !important; color: #1a1405 !important; }
    .hover\:bg-emerald-500:hover { background-color: #e3c565 !important; color: #1a1405 !important; }
    .file\:bg-emerald-600::file-selector-button { background-color: #c9a227 !important; color: #1a1405 !important; }
    .hover\:file\:bg-emerald-500:hover::file-selector-button { background-color: #e3c565 !important; color: #1a1405 !important; }
    .bg-emerald-600\/30 { background-color: rgb(201 162 39 / 0.28) !important; }
    .bg-emerald-500\/10 { background-color: rgb(212 175 55 / 0.10) !important; }
    /* Sombras douradas */
    .shadow-emerald-900\/30 { --tw-shadow-color: rgb(201 162 39 / 0.35) !important; }
    .shadow-emerald-900\/40 { --tw-shadow-color: rgb(201 162 39 / 0.45) !important; }
    .shadow-emerald-500\/25 { --tw-shadow-color: rgb(212 175 55 / 0.30) !important; }
    /* Foco/hover dourado em inputs e selects */
    .focus\:border-emerald-500:focus { border-color: #d4af37 !important; }
    .hover\:border-emerald-500:hover { border-color: #d4af37 !important; }

    body {
      background-color: var(--color-base);
      color: var(--color-text);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
      opacity: 0.8;
    }
    [data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 6mm;
      }
      header, aside, .no-print, #tela-login {
        display: none !important;
      }
      html, body, main {
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 8.5pt !important;
      }
      .print-card, div, table {
        background-color: #ffffff !important;
        border-color: #e5e7eb !important;
        color: #000000 !important;
      }
      th {
        background-color: #f3f4f6 !important;
        color: #000000 !important;
        font-size: 8pt !important;
        padding: 4px 6px !important;
        border: 1px solid #d1d5db !important;
      }
      td {
        border-bottom: 1px solid #e5e7eb !important;
        border-left: 1px solid #e5e7eb !important;
        border-right: 1px solid #e5e7eb !important;
        font-size: 8pt !important;
        padding: 4px 6px !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body class="bg-base text-texto min-h-screen flex flex-col">

  <!-- ================= TELA DE LOGIN ================= -->
  <div id="tela-login" class="fixed inset-0 z-50 bg-base flex items-center justify-center p-4">
    <div class="absolute -top-32 -left-32 w-72 h-72 md:w-96 md:h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-72 h-72 md:w-96 md:h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-black text-sm rounded-xl transition shadow-lg shadow-emerald-900/40 uppercase tracking-wider">

  <!-- ================= APLICAÇÃO PRINCIPAL ================= -->
  <div id="app-container" class="hidden flex-col flex-1">

      <div class="flex items-center justify-between w-full md:w-auto">
        <div class="flex items-center gap-3">
          <img src="logo.webp" alt="BetControl" class="h-12 md:h-14 w-auto mix-blend-screen cursor-pointer" style="filter: drop-shadow(0 0 12px rgba(212,175,55,.35));">

          <div>
            <p class="text-[9px] md:text-[10px] uppercase font-bold tracking-widest text-mutado">Gestão Operacional</p>
          </div>
        </div>

        <div class="flex md:hidden items-center gap-2">
          <button onclick="realizarLogout()" title="Sair" class="p-2 bg-red-600/20 text-red-400 rounded-lg text-xs font-bold">
            🔒 Sair

        </div>
      </div>

      <!-- BARRA DE FILTROS SUPERIOR -->
      <div class="flex flex-wrap items-center justify-end gap-2 md:gap-3 w-full md:w-auto">
        <div class="flex items-center gap-2 bg-panel p-1.5 rounded-lg border border-linha shadow-inner overflow-x-auto max-w-full">

            <input type="date" id="filtroDataFim" onchange="atualizarFiltrosGlobais()" onclick="this.showPicker && this.showPicker()" class="bg-input text-texto text-[11px] md:text-xs px-2 py-1 rounded border border-linha outline-none cursor-pointer">
          </div>
          <button onclick="limparFiltroDatas()" class="text-[11px] text-mutado hover:text-texto px-2 py-1 bg-input hover:brightness-110 rounded border border-linha transition self-end">Limpar</button>

        </div>

        <div>

            <option value="">Todas as Casas</option>

        </div>

        <div class="hidden md:flex items-center gap-3 pl-2 border-l border-linha">

          <select id="selectTema" onchange="mudarTema(this.value)" class="px-2 py-1.5 bg-input border border-linha rounded-lg text-xs text-texto outline-none cursor-pointer hover:border-emerald-500 transition">
            <option value="dark">🌙 Escuro</option>
            <option value="light">☀️ Claro</option>

          </select>

          <div class="text-right border-l border-linha pl-3">
            <span id="headerNomeUsuario" class="block text-xs font-bold text-texto">admin</span>
            <span id="headerPerfilUsuario" class="block text-[9px] text-emerald-400 font-bold uppercase">Editor</span>
          </div>

            🔒 Sair

        </div>
      </div>
    </header>

    <div class="flex flex-col md:flex-row flex-1">
      <aside id="menu-lateral" class="w-full md:w-64 bg-base md:border-r border-b md:border-b-0 border-linha p-3 md:p-6 flex md:flex-col gap-2 overflow-x-auto no-print shrink-0">
        <button id="nav-dashboard" onclick="mudarAba('dashboard')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-emerald-600 text-white font-medium text-xs md:text-sm transition shadow-md shadow-emerald-900/30">
          📊 Dashboard
        </button>
        <button id="nav-volumemes" onclick="mudarAba('volumemes')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          📈 Volume Mês
        </button>
        <button id="nav-operadores" onclick="mudarAba('operadores')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          👥 Operadores
        </button>
        <button id="nav-casas" onclick="mudarAba('casas')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          🏛️ Casas de Apostas
        </button>
        <button id="nav-relatorios" onclick="mudarAba('relatorios')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          📑 Relatórios
        </button>
        <button id="nav-lucro" onclick="mudarAba('lucro')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          💰 Lucro
        </button>
        <button id="nav-pagamentos" onclick="mudarAba('pagamentos')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          💳 Pagamento

        <button id="nav-backup" onclick="mudarAba('backup')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">
          💾 Backup & Importação

        <button id="nav-usuarios" onclick="mudarAba('usuarios')" class="aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition">

      <main class="flex-1 p-4 md:p-8 overflow-x-hidden" id="conteudo-principal">
      </main>

  </div>

  <script>
    const SUPABASE_URL = 'https://uxwuxlkvxubbknaffkca.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ALboDYr5YVBcsso2qH5mig_HlLFPfle';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let graficoVolumeInstancia = null; // Instância global do Chart.js para evitar sobreposição

    const DADOS_INICIAIS = {
      tema: 'dark',
      abaAtiva: 'dashboard',
      dataFormulario: new Date().toISOString().split('T')[0],
      descontosOperadores: {}, 
      ordemRelatorio: 'desc',
      ordemDashboard: 'desc',
      ordemVolumeMes: 'desc',
      ordemLucroMes: 'desc',
      filtroPendentes: false,
      filtros: { dataInicio: '', dataFim: '', operadorId: '', casaId: '' },
      usuarios: [
        { id: 'usr-1', usuario: 'admin', senha: '123456', perfil: 'editor', nome: 'Administrador Mestre', permissoesLeitor: [] },
        { id: 'usr-2', usuario: 'operador', senha: '123456', perfil: 'leitura', nome: 'Operador Padrão', permissoesLeitor: ['dashboard', 'volumemes', 'relatorios', 'lucro'] }
      ],
      operadores: [],
      casas: [],
      apostas: []
    };

    let estado = carregarDadosDoLocalStorage();

    function aplicarTema() {
      document.documentElement.setAttribute('data-theme', estado.tema || 'dark');
      const select = document.getElementById('selectTema');
      if (select) select.value = estado.tema || 'dark';
    }
    
    aplicarTema();

    function mudarTema(novoTema) {
      estado.tema = novoTema;
      salvarDadosNoLocalStorage();
      aplicarTema();
      renderizarAba(); // Recarrega para atualizar as cores do gráfico se estiver no módulo Volume
    }

    function formatarDataBR(dataIso) {
      if (!dataIso) return '';
      const partes = dataIso.split('-');
      if (partes.length !== 3) return dataIso;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function normalizarNomeCasa(nome) {
      if (!nome) return 'OUTRAS / N/A';
      return nome.trim().replace(/\s+/g, ' ').toUpperCase();
    }

    function renderizarFlagCasa(nomeCasa) {
      if (!nomeCasa) return '<span class="text-mutado">N/A</span>';
      
      const nomeLimpo = normalizarNomeCasa(nomeCasa);
      let estilo = "background-color: #ffffff; color: #000000; border: 1px solid rgba(0,0,0,0.1);";

      if (/^HM\s*BETS$/i.test(nomeLimpo)) {
        estilo = "background-color: #f97316; color: #000000;";
      } else if (/^BET\s*ZAP$/i.test(nomeLimpo)) {
        estilo = "background-color: #22c55e; color: #000000;";
      } else if (/^BET\s*CERTA$/i.test(nomeLimpo)) {
        estilo = "background-color: #ff0000; color: #ffffff;";
      } else if (/^X\s*BETS$/i.test(nomeLimpo)) {
        estilo = "background-color: #800080; color: #ffffff;";
      } else if (/^GG\s*BETS$/i.test(nomeLimpo)) {
        estilo = "background-color: #ffffff; color: #000000;";
      }

      return `<span class="px-2.5 py-1 rounded-md text-[11px] md:text-xs font-black inline-flex items-center shadow-sm uppercase" style="${estilo}">${nomeLimpo}</span>`;
    }

    function salvarDadosNoLocalStorage() {
      localStorage.setItem('betcontrol_dados', JSON.stringify(estado));
    }

    function carregarDadosDoLocalStorage() {
      const dadosSalvos = localStorage.getItem('betcontrol_dados');
      if (dadosSalvos) {
        try {
          const parsed = JSON.parse(dadosSalvos);
          if (!parsed.tema) parsed.tema = 'dark';
          if (!parsed.dataFormulario) parsed.dataFormulario = new Date().toISOString().split('T')[0];
          if (!parsed.filtros) parsed.filtros = { dataInicio: '', dataFim: '', operadorId: '', casaId: '' };
          if (parsed.filtros.casaId === undefined) parsed.filtros.casaId = '';
          if (!parsed.descontosOperadores) parsed.descontosOperadores = {};
          if (!parsed.ordemRelatorio) parsed.ordemRelatorio = 'desc';
          if (!parsed.ordemDashboard) parsed.ordemDashboard = 'desc';
          if (!parsed.ordemVolumeMes) parsed.ordemVolumeMes = 'desc';
          if (!parsed.ordemLucroMes) parsed.ordemLucroMes = 'desc';
          if (parsed.filtroPendentes === undefined) parsed.filtroPendentes = false;
          if (!parsed.usuarios || parsed.usuarios.length === 0) {
            parsed.usuarios = [
              { id: 'usr-1', usuario: 'admin', senha: '123456', perfil: 'editor', nome: 'Administrador Mestre', permissoesLeitor: [] },
              { id: 'usr-2', usuario: 'operador', senha: '123456', perfil: 'leitura', nome: 'Operador Padrão', permissoesLeitor: ['dashboard', 'volumemes', 'relatorios', 'lucro'] }
            ];
          } else {
            parsed.usuarios.forEach(u => {
              if (!u.permissoesLeitor) u.permissoesLeitor = [];
            });
          }
          return parsed;
        } catch (e) {
          console.error('Erro ao ler do localStorage:', e);
        }
      }
      return DADOS_INICIAIS;
    }

    async function buscarTodosPaginado(tabela) {
      const lote = 1000;
      let inicio = 0;
      let todos = [];
      while (true) {
        const { data, error } = await supabaseClient.from(tabela).select('*').range(inicio, inicio + lote - 1);
        if (error) throw error;
        if (!data || data.length === 0) break;
        todos = todos.concat(data);
        if (data.length < lote) break;
        inicio += lote;
      }
      return todos;
    }

    async function carregarDadosDoServidorOuLocal() {
      try {
        const ops = await buscarTodosPaginado('operadores');
        const css = await buscarTodosPaginado('casas');
        const aps = await buscarTodosPaginado('apostas');
        const usrs = await buscarTodosPaginado('usuarios');

        if (ops) {
          estado.operadores = ops;
        }
        if (css) {
          estado.casas = css.map(c => ({ id: c.id, operadorId: c.operador_id, nome: c.nome }));
        }
        if (aps) {
          estado.apostas = aps.map(a => ({ 
            id: a.id, 
            operadorId: a.operador_id, 
            casaId: a.casa_id, 
            data: a.data, 
            stake: Number(a.stake), 
            retorno: a.retorno !== null ? Number(a.retorno) : null, 
            finalizada: a.finalizada 
          }));
        }
        if (usrs && usrs.length > 0) {
          estado.usuarios = usrs.map(u => ({
            ...u,
            permissoesLeitor: u.permissoes_leitor ? (typeof u.permissoes_leitor === 'string' ? JSON.parse(u.permissoes_leitor) : u.permissoes_leitor) : (u.permissoesLeitor || [])
          }));
        }
        salvarDadosNoLocalStorage();
      } catch (erro) {
        console.warn("Modo Offline ativado: Usando cache local.", erro);
        estado = carregarDadosDoLocalStorage();
      }
      verificarAutenticacao();
    }

    async function salvarNaNuvemELocal(tipo, dadosObjeto) {
      salvarDadosNoLocalStorage();
      try {
        if (tipo === 'aposta') {
          await supabaseClient.from('apostas').upsert({
            id: dadosObjeto.id,
            operador_id: dadosObjeto.operadorId,
            casa_id: dadosObjeto.casaId,
            data: dadosObjeto.data,
            stake: dadosObjeto.stake,
            retorno: dadosObjeto.retorno,
            finalizada: dadosObjeto.finalizada
          });
        } else if (tipo === 'operador') {
          await supabaseClient.from('operadores').upsert({ id: dadosObjeto.id, nome: dadosObjeto.nome, documento: dadosObjeto.documento || '', telefone: dadosObjeto.telefone || '', cep1: dadosObjeto.cep1 || '', cep2: dadosObjeto.cep2 || '', cep3: dadosObjeto.cep3 || '', digitos: dadosObjeto.digitos || '' });
        } else if (tipo === 'casa') {
          await supabaseClient.from('casas').upsert({ id: dadosObjeto.id, operador_id: dadosObjeto.operadorId, nome: dadosObjeto.nome });
        } else if (tipo === 'usuario') {
          await supabaseClient.from('usuarios').upsert({ 
            id: dadosObjeto.id, 
            usuario: dadosObjeto.usuario, 
            senha: dadosObjeto.senha, 
            perfil: dadosObjeto.perfil, 
            nome: dadosObjeto.nome,
            permissoes_leitor: JSON.stringify(dadosObjeto.permissoesLeitor || [])
          });
        }
      } catch (erro) {
        console.error("Erro ao sincronizar com Supabase:", erro);
      }
    }

    async function deletarDaNuvemELocal(tipo, id) {
      salvarDadosNoLocalStorage();
      try {
        if (tipo === 'aposta') await supabaseClient.from('apostas').delete().eq('id', id);
        if (tipo === 'operador') await supabaseClient.from('operadores').delete().eq('id', id);
        if (tipo === 'casa') await supabaseClient.from('casas').delete().eq('id', id);
        if (tipo === 'usuario') await supabaseClient.from('usuarios').delete().eq('id', id);
      } catch (erro) {
        console.error("Erro ao deletar na nuvem:", erro);
      }
    }

    function obterUsuarioLogado() {
      const username = localStorage.getItem('betcontrol_user_ativo');
      if (!username) return null;
      return estado.usuarios.find(u => u.usuario === username) || null;
    }

    function verificarSeTemPermissaoEdicao() {
      const usr = obterUsuarioLogado();
      if (!usr) return false;
      return usr.perfil === 'editor';
    }

    function verificarPermissaoAba(aba) {
      const usr = obterUsuarioLogado();
      if (!usr) return false;
      if (usr.perfil === 'editor') return true;
      if (aba === 'usuarios' || aba === 'backup') return false;
      const permissoes = usr.permissoesLeitor || [];
      return permissoes.includes(aba);
    }

    function realizarLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUsuario').value.trim();
      const pass = document.getElementById('loginSenha').value.trim();
      const erroDiv = document.getElementById('loginErro');

      const usuarioEncontrado = estado.usuarios.find(u => u.usuario === user && u.senha === pass);

      if (usuarioEncontrado) {
        localStorage.setItem('betcontrol_logado', 'true');
        localStorage.setItem('betcontrol_user_ativo', usuarioEncontrado.usuario);
        erroDiv.classList.add('hidden');
        verificarAutenticacao();
      } else {
        erroDiv.classList.remove('hidden');
      }
    }

    function realizarLogout() {
      localStorage.removeItem('betcontrol_logado');
      localStorage.removeItem('betcontrol_user_ativo');
      verificarAutenticacao();
    }

    function verificarAutenticacao() {
      const logado = localStorage.getItem('betcontrol_logado');
      const telaLogin = document.getElementById('tela-login');
      const appContainer = document.getElementById('app-container');

      if (logado === 'true') {
        const usr = obterUsuarioLogado();
        if (usr) {
          const elNome = document.getElementById('headerNomeUsuario');
          const elPerfil = document.getElementById('headerPerfilUsuario');
          if (elNome) elNome.textContent = usr.usuario;
          if (elPerfil) elPerfil.textContent = usr.perfil === 'editor' ? '✏️ Editor' : '👁️ Leitura';
          
          atualizarVisibilidadeMenuLateral(usr);

          if (!verificarPermissaoAba(estado.abaAtiva)) {
            const abasPossiveis = ['dashboard', 'volumemes', 'operadores', 'casas', 'relatorios', 'lucro', 'pagamentos', 'backup', 'usuarios'];
            const primeiraPermitida = abasPossiveis.find(a => verificarPermissaoAba(a));
            if (primeiraPermitida) {
              estado.abaAtiva = primeiraPermitida;
            } else {
              estado.abaAtiva = 'dashboard';
            }
          }
        }
        telaLogin.classList.add('hidden');
        appContainer.classList.remove('hidden');
        appContainer.classList.add('flex');
        restaurarFiltrosNaUI();
        atualizarSelectOperadores();
        atualizarSelectCasasGlobais();
        renderizarAba();
      } else {
        appContainer.classList.remove('flex');
        appContainer.classList.add('hidden');
        telaLogin.classList.remove('hidden');
      }
    }

    function atualizarVisibilidadeMenuLateral(usr) {
      const mapaBotoes = {
        'dashboard': 'nav-dashboard',
        'volumemes': 'nav-volumemes',
        'operadores': 'nav-operadores',
        'casas': 'nav-casas',
        'relatorios': 'nav-relatorios',
        'lucro': 'nav-lucro',
        'pagamentos': 'nav-pagamentos',
        'backup': 'nav-backup',
        'usuarios': 'nav-usuarios'
      };

      Object.keys(mapaBotoes).forEach(aba => {
        const btnId = mapaBotoes[aba];
        const btnEl = document.getElementById(btnId);
        if (!btnEl) return;

        if (usr.perfil === 'editor') {
          btnEl.style.display = 'flex';
        } else {
          if (aba === 'backup') {
            btnEl.style.display = 'none';
          } else if (aba === 'usuarios') {
            btnEl.style.display = 'flex';
          } else {
            if (usr.permissoesLeitor && usr.permissoesLeitor.includes(aba)) {
              btnEl.style.display = 'flex';
            } else {
              btnEl.style.display = 'none';
            }
          }
        }
      });
    }

    window.onload = async () => {
      aplicarTema();
      await carregarDadosDoServidorOuLocal();
    };

    function restaurarFiltrosNaUI() {
      if (estado.filtros) {
        const di = document.getElementById('filtroDataInicio');
        const df = document.getElementById('filtroDataFim');
        if (di) di.value = estado.filtros.dataInicio || '';
        if (df) df.value = estado.filtros.dataFim || '';
      }
    }

    function atualizarFiltrosGlobais() {
      estado.filtros = {
        dataInicio: document.getElementById('filtroDataInicio').value,
        dataFim: document.getElementById('filtroDataFim').value,
        operadorId: document.getElementById('selectOperador').value,
        casaId: document.getElementById('selectCasaGlobal').value
      };
      salvarDadosNoLocalStorage();
      renderizarAba();
    }

    function mudarAba(novaAba) {
      if (!verificarPermissaoAba(novaAba)) {
        alert("Você não possui permissão para acessar esta seção.");
        return;
      }
      estado.abaAtiva = novaAba;
      salvarDadosNoLocalStorage();
      document.querySelectorAll('.aba-btn').forEach(btn => {
        btn.className = 'aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-panel text-mutado hover:bg-input font-medium text-xs md:text-sm transition';

      const btnAtivo = document.getElementById(`nav-${novaAba}`);
      if (btnAtivo) {
        btnAtivo.className = 'aba-btn whitespace-nowrap flex items-center gap-2.5 px-3.5 py-2.5 md:px-4 md:py-3 rounded-lg bg-emerald-600 text-white font-medium text-xs md:text-sm transition shadow-md shadow-emerald-900/30';
      }
      renderizarAba();
    }

    function atualizarSelectOperadores() {
      const select = document.getElementById('selectOperador');
      if (!select) return;
      const usr = obterUsuarioLogado();

      select.innerHTML = '<option value="">Todos os Operadores</option>';
      
      const operadoresDisponiveis = (usr && usr.perfil !== 'editor')
        ? estado.operadores.filter(op => op.nome.toLowerCase() === usr.nome.toLowerCase() || op.id === usr.operadorId)
        : estado.operadores;

      operadoresDisponiveis.forEach(op => {
        const option = document.createElement('option');
        option.value = op.id;
        option.textContent = op.nome;
        select.appendChild(option);
      });

      if (usr && usr.perfil !== 'editor' && operadoresDisponiveis.length === 1) {
        select.value = operadoresDisponiveis[0].id;
        select.disabled = true;
      } else {
        select.disabled = false;
        if (estado.filtros && estado.filtros.operadorId) {
          select.value = estado.filtros.operadorId;
        }
      }
    }

    function atualizarSelectCasasGlobais() {
      const select = document.getElementById('selectCasaGlobal');
      if (!select) return;
      
      const operadorFiltro = estado.filtros ? estado.filtros.operadorId : '';
      const casasDisponíveis = operadorFiltro 
        ? estado.casas.filter(c => (c.operadorId || c.clienteId) === operadorFiltro)
        : estado.casas;

      select.innerHTML = '<option value="">Todas as Casas</option>';
      casasDisponíveis.forEach(c => {
        const option = document.createElement('option');
        option.value = c.id;
        option.textContent = c.nome;
        select.appendChild(option);
      });

      if (estado.filtros && estado.filtros.casaId) {
        select.value = estado.filtros.casaId;
      }
    }

    function limparFiltroDatas() {
      document.getElementById('filtroDataInicio').value = '';
      document.getElementById('filtroDataFim').value = '';
      atualizarFiltrosGlobais();
    }

    function filtrarApostasPorGeral(apostas) {
      const usr = obterUsuarioLogado();
      let apostasBase = apostas;

      if (usr && usr.perfil !== 'editor') {
        const operadoresDoLeitor = estado.operadores.filter(op => op.nome.toLowerCase() === usr.nome.toLowerCase() || op.id === usr.operadorId);
        const idsOpValidos = operadoresDoLeitor.map(op => op.id);
        apostasBase = apostas.filter(a => {
          const opId = a.operadorId || a.clienteId;
          return idsOpValidos.includes(opId);
        });
      }

      if (estado.filtroPendentes && estado.abaAtiva === 'dashboard') {
        return apostasBase.filter(a => {
          const opId = a.operadorId || a.clienteId;
          const operadorFiltro = estado.filtros ? estado.filtros.operadorId : '';
          const casaFiltro = estado.filtros ? estado.filtros.casaId : '';
          if (operadorFiltro && opId !== operadorFiltro) return false;
          if (casaFiltro && a.casaId !== casaFiltro) return false;
          return !a.finalizada;
        });
      }

      const operadorFiltro = estado.filtros ? estado.filtros.operadorId : '';
      const casaFiltro = estado.filtros ? estado.filtros.casaId : '';
      const dataInicio = estado.filtros ? estado.filtros.dataInicio : '';
      const dataFim = estado.filtros ? estado.filtros.dataFim : '';

      return apostasBase.filter(a => {
        const opId = a.operadorId || a.clienteId;
        if (operadorFiltro && opId !== operadorFiltro) return false;
        if (casaFiltro && a.casaId !== casaFiltro) return false;
        if (dataInicio && a.data < dataInicio) return false;
        if (dataFim && a.data > dataFim) return false;
        return true;
      });
    }

    async function sincronizarTudoManual() {
      const btn = document.getElementById('btnSincronizarManual');
      if (btn) {
        btn.innerHTML = '⏳ Sincronizando...';
        btn.disabled = true;
      }
      
      salvarDadosNoLocalStorage();
      
      try {
        for (const op of estado.operadores) {
          await supabaseClient.from('operadores').upsert({ id: op.id, nome: op.nome, documento: op.documento || '', telefone: op.telefone || '', cep1: op.cep1 || '', cep2: op.cep2 || '', cep3: op.cep3 || '', digitos: op.digitos || '' });
        }
        for (const casa of estado.casas) {
          await supabaseClient.from('casas').upsert({ id: casa.id, operador_id: casa.operadorId, nome: casa.nome });
        }
        for (const aposta of estado.apostas) {
          await supabaseClient.from('apostas').upsert({
            id: aposta.id,
            operador_id: aposta.operadorId,
            casa_id: aposta.casaId,
            data: aposta.data,
            stake: aposta.stake,
            retorno: aposta.retorno,
            finalizada: aposta.finalizada
          });
        }
        if (verificarSeTemPermissaoEdicao()) {
            for (const u of estado.usuarios) {
              await supabaseClient.from('usuarios').upsert({ 
                id: u.id, 
                usuario: u.usuario, 
                senha: u.senha, 
                perfil: u.perfil, 
                nome: u.nome,
                permissoes_leitor: JSON.stringify(u.permissoesLeitor || [])
              });
            }
        }
        
        alert("✅ Todos os dados foram salvos e sincronizados com a nuvem com sucesso!");
      } catch (erro) {
        console.error("Erro na sincronização:", erro);
        alert("⚠️ Houve um erro ao sincronizar com a nuvem. Seus dados estão protegidos localmente.");
      } finally {
        if (btn) {
          btn.innerHTML = '💾 Salvar Tudo (Sincronizar)';
          btn.disabled = false;
        }
      }
    }

    function renderizarAba() {
      const main = document.getElementById('conteudo-principal');
      if (!verificarPermissaoAba(estado.abaAtiva)) {
        main.innerHTML = `<div class="p-6 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl text-center">Acesso negado a esta seção.</div>`;
        return;
      }

      if (estado.abaAtiva === 'dashboard') renderizarDashboard(main);
      else if (estado.abaAtiva === 'volumemes') renderizarVolumeMes(main);
      else if (estado.abaAtiva === 'operadores') renderizarOperadores(main);
      else if (estado.abaAtiva === 'casas') renderizarCasas(main);
      else if (estado.abaAtiva === 'relatorios') renderizarRelatorios(main);
      else if (estado.abaAtiva === 'lucro') renderizarLucro(main);
      else if (estado.abaAtiva === 'pagamentos') renderizarPagamentos(main);
      else if (estado.abaAtiva === 'backup') renderizarBackup(main);
      else if (estado.abaAtiva === 'usuarios') renderizarUsuarios(main);
    }

                        ` : `R$ ${a.stake.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`}
                      </td>
                      <td class="p-3 text-texto">
                        ${podeEditar ? (
                          a.editando ? `
                            <input type="number" step="0.01" id="input-retorno-${a.id}" value="${a.retorno !== null ? a.retorno : ''}" placeholder="Ex: 0" class="w-28 px-2 py-1 bg-input border border-linha rounded text-texto text-xs outline-none">
                          ` : (a.retorno !== null ? `R$ ${a.retorno.toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : `
                            <input type="number" step="0.01" id="input-retorno-${a.id}" placeholder="Ex: 0" class="w-28 px-2 py-1 bg-input border border-linha rounded text-texto text-xs outline-none">
                          `)
                        ) : (a.retorno !== null ? `R$ ${a.retorno.toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : '-')}
                      </td>
                      <td class="p-3">${statusTag}</td>
                      <td class="p-3 text-right no-print">
                        ${podeEditar ? `
                          <div class="flex items-center justify-end gap-1.5">
                            ${a.editando ? `
                              <button onclick="salvarEdicaoAposta('${a.id}')" class="px-2.5 py-1 bg-emerald-600 text-white text-xs rounded font-bold">Salvar</button>
                              <button onclick="cancelarEdicao('${a.id}')" class="px-2 py-1 bg-gray-600 text-gray-200 text-xs rounded">X</button>
                            ` : (a.finalizada ? `
                              <button onclick="habilitarEdicao('${a.id}')" class="px-2.5 py-1 bg-blue-600/20 text-blue-500 border border-blue-500/40 hover:bg-blue-600 hover:text-white text-xs rounded font-bold transition">EDITAR</button>
                            ` : `
                              <button onclick="habilitarEdicao('${a.id}')" class="px-2.5 py-1 bg-blue-600/20 text-blue-500 border border-blue-500/40 hover:bg-blue-600 hover:text-white text-xs rounded font-bold transition">EDITAR</button>
                              <button onclick="salvarRetornoAposta('${a.id}')" class="px-2.5 py-1 bg-emerald-600/30 text-[#7c5f14] dark:text-amber-300 text-xs rounded font-bold">FINALIZAR</button>
                              <button onclick="zerarApostaDirectly('${a.id}')" class="px-2.5 py-1 bg-red-600/20 text-red-500 text-xs rounded font-bold">ZERAR</button>
                            `)}
                            <button onclick="deletarAposta('${a.id}')" class="text-mutado hover:text-red-500 text-xs p-1">🗑️</button>
                          </div>
                        ` : '<span class="text-xs text-mutado">-</span>'}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function alternarFiltroPendentes() {
      estado.filtroPendentes = !estado.filtroPendentes;
      salvarDadosNoLocalStorage();
      renderizarAba();
    }

    // ================= 1.1 MÓDULO VOLUME MÊS =================
    function renderizarVolumeMes(container) {
      const apostasFiltradas = filtrarApostasPorGeral(estado.apostas);

      const dadosPorData = {};
      let volumeTotalGeral = 0;
      let lucroLiquidoTotalGeral = 0;
      let totalQtdApostasGeral = apostasFiltradas.length;

      apostasFiltradas.forEach(a => {
        const dataAposta = a.data || 'Sem Data';
        const stakeAposta = a.stake || 0;
        let lucroLiquidoAposta = 0;

        if (a.finalizada && a.retorno !== null) {
          lucroLiquidoAposta = a.retorno - a.stake;
        }

        volumeTotalGeral += stakeAposta;
        lucroLiquidoTotalGeral += lucroLiquidoAposta;

        if (!dadosPorData[dataAposta]) {
          dadosPorData[dataAposta] = {
            data: dataAposta,
            volumeDia: 0,
            lucroLiquidoDia: 0,
            quantidade: 0,
            casasNoDia: new Set()
          };
        }

        dadosPorData[dataAposta].volumeDia += stakeAposta;
        dadosPorData[dataAposta].lucroLiquidoDia += lucroLiquidoAposta;
        dadosPorData[dataAposta].quantidade += 1;

        const casaObj = estado.casas.find(c => c.id === a.casaId);
        if (casaObj) {
          dadosPorData[dataAposta].casasNoDia.add(normalizarNomeCasa(casaObj.nome));
        }
      });

      const datasOrdenadas = Object.keys(dadosPorData).sort((a, b) => {
        return estado.ordemVolumeMes === 'asc' ? new Date(a) - new Date(b) : new Date(b) - new Date(a);
      });

      // Preparação de dados para o Gráfico (sempre cronológico)
      const datasCronologicas = Object.keys(dadosPorData).sort((a, b) => new Date(a) - new Date(b));
      const labelsGrafico = [];
      const dataVolumeAcumulado = [];
      const dataLucroAcumulado = [];
      
      let volAcum = 0;
      let lucroAcum = 0;
      
      datasCronologicas.forEach(dataStr => {
        const item = dadosPorData[dataStr];
        volAcum += item.volumeDia;
        lucroAcum += item.lucroLiquidoDia;
        labelsGrafico.push(formatarDataBR(dataStr));
        dataVolumeAcumulado.push(volAcum);
        dataLucroAcumulado.push(lucroAcum);
      });

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 no-print">
          <div>
            <h2 class="text-xl md:text-2xl font-bold text-texto">📈 Módulo Volume Mês</h2>
            <p class="text-xs text-mutado">Síntese de volume de apostas e lucro líquido consolidado por data com base nos filtros do dashboard.</p>
          </div>
          <button onclick="window.print()" class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black rounded-xl transition shadow-lg shadow-emerald-900/40">
            🖨️ Imprimir / Salvar PDF
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-panel border border-linha rounded-xl p-5">
            <p class="text-xs text-mutado mb-1">Volume Total Acumulado</p>
            <h3 class="text-xl md:text-2xl font-black text-blue-500">
              R$ ${volumeTotalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
            </h3>
          </div>
          <div class="bg-panel border border-linha rounded-xl p-5">
            <p class="text-xs text-mutado mb-1">Lucro Líquido do Mês / Período</p>
            <h3 class="text-xl md:text-2xl font-bold ${lucroLiquidoTotalGeral > 0 ? 'text-emerald-500' : lucroLiquidoTotalGeral < 0 ? 'text-red-500' : 'text-texto'}">
              R$ ${lucroLiquidoTotalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
            </h3>
          </div>
          <div class="bg-panel border border-linha rounded-xl p-5">
            <p class="text-xs text-mutado mb-1">Total de Apostas Sintetizadas</p>
            <h3 class="text-xl md:text-2xl font-bold text-texto">${totalQtdApostasGeral}</h3>
          </div>
        </div>

        <!-- GRÁFICO DE EVOLUÇÃO (LINHAS ACUMULADAS) -->
        ${datasCronologicas.length > 0 ? `
        <div class="bg-panel border border-linha rounded-xl p-4 md:p-6 mb-6 no-print">
          <h3 class="text-sm font-bold text-texto uppercase tracking-wider mb-4">📉 Gráfico de Evolução (Acumulado)</h3>
          <div class="relative h-64 md:h-80 w-full">
            <canvas id="graficoVolumeMes"></canvas>
          </div>
        </div>
        ` : ''}

        <div class="bg-panel border border-linha rounded-xl p-4 mb-4 flex items-center justify-between gap-3 no-print">
          <h3 class="text-sm md:text-md font-bold text-texto uppercase tracking-wider">📅 Dashboard Sintético por Data</h3>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-texto">Ordem:</span>
            <select id="selectOrdemVolumeMes" onchange="estado.ordemVolumeMes=this.value;salvarDadosNoLocalStorage();renderizarAba()" class="px-2.5 py-1.5 bg-input border border-linha rounded text-xs text-texto outline-none font-bold">
              <option value="desc" ${estado.ordemVolumeMes === 'desc' ? 'selected' : ''}>🔽 Recentes</option>
              <option value="asc" ${estado.ordemVolumeMes === 'asc' ? 'selected' : ''}>🔼 Antigas</option>
            </select>
          </div>
        </div>

        <div class="bg-panel border border-linha rounded-xl p-4 md:p-6">
          <div class="overflow-x-auto rounded-lg border border-linha">
            <table class="w-full text-left text-xs text-mutado min-w-[700px]">
              <thead class="bg-panelAlt text-texto uppercase text-[10px]">
                <tr>
                  <th class="p-3 border-b border-linha">Data (DD/MM/AAAA)</th>
                  <th class="p-3 border-b border-linha">Ano / Mês</th>
                  <th class="p-3 border-b border-linha">Qtd. Apostas</th>
                  <th class="p-3 border-b border-linha">Casas Envolvidas</th>
                  <th class="p-3 border-b border-linha">Volume Apostado (Dia)</th>
                  <th class="p-3 border-b border-linha">Lucro Líquido (Dia)</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-linha">
                ${datasOrdenadas.length === 0 ? '<tr><td colspan="6" class="p-4 text-center text-mutado">Nenhum registro encontrado para o filtro selecionado.</td></tr>' : ''}
                ${datasOrdenadas.map((dataStr, index) => {
                  const item = dadosPorData[dataStr];
                  const [ano, mes, dia] = dataStr.split('-');
                  const mesAnoStr = `${mes}/${ano}`;
                  const casasLista = Array.from(item.casasNoDia).map(c => renderizarFlagCasa(c)).join(' ');
                  const corLucroDia = item.lucroLiquidoDia > 0 ? 'text-emerald-500 font-bold' : item.lucroLiquidoDia < 0 ? 'text-red-500 font-bold' : 'text-texto font-bold';

                  return `
                    <tr class="${index % 2 === 0 ? 'bg-panel' : 'bg-panelAlt'} hover:opacity-80 transition-opacity">
                      <td class="p-3 font-bold text-texto">${formatarDataBR(dataStr)}</td>
                      <td class="p-3 font-semibold text-emerald-500">${mesAnoStr}</td>
                      <td class="p-3 text-texto">${item.quantidade}</td>
                      <td class="p-3">${casasLista || '<span class="text-mutado">N/A</span>'}</td>
                      <td class="p-3 font-semibold text-blue-500">R$ ${item.volumeDia.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                      <td class="p-3 ${corLucroDia}">R$ ${item.lucroLiquidoDia.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      // Inicialização do Gráfico após inserir o HTML
      if (datasCronologicas.length > 0) {
        setTimeout(() => {
          const ctx = document.getElementById('graficoVolumeMes');
          if (!ctx) return;

          if (window.graficoVolumeInstancia) {
            window.graficoVolumeInstancia.destroy();
          }

          const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
          const textColor = isDark ? '#9ca3af' : '#4b5563';
          const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';

          window.graficoVolumeInstancia = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labelsGrafico,
              datasets: [
                {
                  label: 'Volume Acumulado',
                  data: dataVolumeAcumulado,
                  borderColor: '#3b82f6', // blue-500
                  backgroundColor: 'rgba(59, 130, 246, 0.1)',
                  borderWidth: 2,
                  fill: true,
                  tension: 0.3,
                  yAxisID: 'y'
                },
                {
                  label: 'Lucro Líquido Acumulado',
                  data: dataLucroAcumulado,
                  borderColor: '#10b981', // emerald-500
                  backgroundColor: 'rgba(16, 185, 129, 0.1)',
                  borderWidth: 2,
                  fill: true,
                  tension: 0.3,
                  yAxisID: 'y1'
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { 
                  labels: { color: textColor, font: { family: 'ui-sans-serif, system-ui, sans-serif', size: 11, weight: 'bold' } } 
                },
                tooltip: {
                  backgroundColor: isDark ? '#1f2937' : '#ffffff',
                  titleColor: isDark ? '#ffffff' : '#111827',
                  bodyColor: isDark ? '#d1d5db' : '#4b5563',
                  borderColor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)',
                  borderWidth: 1,
                  callbacks: {
                    label: function(context) {
                      let label = context.dataset.label || '';
                      if (label) label += ': ';
                      if (context.parsed.y !== null) {
                        label += new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(context.parsed.y);
                      }
                      return label;
                    }
                  }
                }
              },
              scales: {
                x: { 
                  ticks: { color: textColor, font: { size: 10 } }, 
                  grid: { color: gridColor, drawBorder: false } 
                },
                y: {
                  type: 'linear', display: true, position: 'left',
                  title: { display: true, text: 'Volume (R$)', color: '#3b82f6', font: {size: 10, weight: 'bold'} },
                  ticks: { color: '#3b82f6', font: {size: 10}, callback: value => 'R$ ' + (value/1000) + 'k' },
                  grid: { color: gridColor, drawBorder: false }
                },
                y1: {
                  type: 'linear', display: true, position: 'right',
                  title: { display: true, text: 'Lucro (R$)', color: '#10b981', font: {size: 10, weight: 'bold'} },
                  ticks: { color: '#10b981', font: {size: 10}, callback: value => 'R$ ' + (value/1000) + 'k' },
                  grid: { drawOnChartArea: false, drawBorder: false }
                }
              }
            }
          });
        }, 50);
      }
    }

    function atualizarDataFormulario(novaData) {
      estado.dataFormulario = novaData;
      salvarDadosNoLocalStorage();
    }

    function atualizarCasasFormAposta() {
      const operadorId = document.getElementById('apostaOperador').value;
      const selectCasa = document.getElementById('apostaCasa');
      if (!selectCasa) return;
      selectCasa.innerHTML = '';

      const casasDoOperador = estado.casas.filter(c => (c.operadorId || c.clienteId) === operadorId);
      if (casasDoOperador.length === 0) {
        selectCasa.innerHTML = '<option value="">Nenhuma casa cadastrada</option>';
        return;
      }

      casasDoOperador.forEach(c => {
        const option = document.createElement('option');
        option.value = c.id;
        option.textContent = c.nome;
        selectCasa.appendChild(option);
      });
    }

    async function adicionarAposta(event) {
      event.preventDefault();
      if (!verificarSeTemPermissaoEdicao()) return;
      const operadorId = document.getElementById('apostaOperador').value;
      const casaId = document.getElementById('apostaCasa').value;
      const stake = parseFloat(document.getElementById('apostaStake').value);
      const dataAposta = document.getElementById('apostaData').value;
      const qtd = parseInt(document.getElementById('apostaQtd').value) || 1;

      if (!casaId) {
        alert("Cadastre uma casa de apostas para este operador primeiro.");
        return;
      }

      estado.dataFormulario = dataAposta;
      for (let i = 0; i < qtd; i++) {
        const novaAposta = {
          id: `aposta-${Date.now()}-${i}`,
          operadorId,
          casaId,
          data: dataAposta,
          stake,
          retorno: null,
          finalizada: false
        };
        estado.apostas.push(novaAposta);
        await salvarNaNuvemELocal('aposta', novaAposta);
      }

      renderizarAba();
    }

    async function salvarRetornoAposta(apostaId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      const input = document.getElementById(`input-retorno-${apostaId}`);
      if (!input || input.value === '') {
        alert("Digite o valor de retorno.");
        return;
      }
      const aposta = estado.apostas.find(a => a.id === apostaId);
      if (aposta) {
        aposta.retorno = parseFloat(input.value);
        aposta.finalizada = true;
        aposta.editando = false;
        await salvarNaNuvemELocal('aposta', aposta);
        renderizarAba();
      }
    }

    async function salvarEdicaoAposta(apostaId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      const inputCasa = document.getElementById(`input-casa-${apostaId}`);
      const inputStake = document.getElementById(`input-stake-${apostaId}`);
      const inputRetorno = document.getElementById(`input-retorno-${apostaId}`);
      
      const aposta = estado.apostas.find(a => a.id === apostaId);
      if (aposta) {
        if (inputCasa) aposta.casaId = inputCasa.value;
        if (inputStake && inputStake.value !== '') aposta.stake = parseFloat(inputStake.value);
        if (inputRetorno && inputRetorno.value !== '') {
          aposta.retorno = parseFloat(inputRetorno.value);
          aposta.finalizada = true;
        } else if (inputRetorno && inputRetorno.value === '') {
          aposta.retorno = null;
          aposta.finalizada = false;
        }
        aposta.editando = false;
        await salvarNaNuvemELocal('aposta', aposta);
        renderizarAba();
      }
    }

    async function zerarApostaDirectly(apostaId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      const aposta = estado.apostas.find(a => a.id === apostaId);
      if (aposta) {
        aposta.retorno = 0;
        aposta.finalizada = true;
        aposta.editando = false;
        await salvarNaNuvemELocal('aposta', aposta);
        renderizarAba();
      }
    }

    function habilitarEdicao(apostaId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      const aposta = estado.apostas.find(a => a.id === apostaId);
      if (aposta) {
        aposta.editando = true;
        renderizarAba();
      }
    }

    function cancelarEdicao(apostaId) {
      const aposta = estado.apostas.find(a => a.id === apostaId);
      if (aposta) {
        aposta.editando = false;
        renderizarAba();
      }
    }

    async function deletarAposta(apostaId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      if (confirm("Excluir esta aposta?")) {
        estado.apostas = estado.apostas.filter(a => a.id !== apostaId);
        await deletarDaNuvemELocal('aposta', apostaId);
        renderizarAba();
      }
    }

    // ================= 2. OPERADORES =================

        <div class="bg-panel border border-linha rounded-xl p-4 md:p-6">

                <tr>
                  <th class="p-3 border-b border-linha">Nome Completo</th>
                  <th class="p-3 border-b border-linha">Telefone</th>

              <tbody class="divide-y divide-linha">
                ${estado.operadores.length === 0 ? '<tr><td colspan="5" class="p-4 text-center text-mutado">Nenhum operador cadastrado.</td></tr>' : ''}
                ${estado.operadores.map((op, index) => `
                  <tr class="${index % 2 === 0 ? 'bg-panel' : 'bg-panelAlt'}">
                    <td class="p-3 font-semibold text-texto">${op.nome || '-'}</td>
                    <td class="p-3 text-texto">${op.telefone || '-'}</td>

    async function salvarOperadorForm(e) {
      e.preventDefault();
      if (!verificarSeTemPermissaoEdicao()) return;
      
      const idExistente = document.getElementById('editOperadorId').value;
      const nomeVal = document.getElementById('novoNome').value;
      const telefoneVal = document.getElementById('novoTelefone').value;
      const documentoVal = document.getElementById('novoDocumento').value;
      const cep1Val = document.getElementById('novoCep1').value;

      if (idExistente) {
        const op = estado.operadores.find(o => o.id === idExistente);
        if (op) {
          op.nome = nomeVal;
          op.telefone = telefoneVal;
          op.documento = documentoVal;
          op.cep1 = cep1Val;
          await salvarNaNuvemELocal('operador', op);
        }
      } else {
        const novoOp = {
          id: `operador-${Date.now()}`,
          nome: nomeVal,
          telefone: telefoneVal,
          documento: documentoVal,
          cep1: cep1Val,
          cep2: '',
          cep3: '',
          digitos: ''
        };
        estado.operadores.push(novoOp);
        await salvarNaNuvemELocal('operador', novoOp);
      }

      atualizarSelectOperadores();
      atualizarSelectCasasGlobais();
      renderizarAba();
    }

    function carregarOperadorParaEdicao(id) {
      const op = estado.operadores.find(o => o.id === id);
      if (!op) return;

      document.getElementById('editOperadorId').value = op.id;
      document.getElementById('novoNome').value = op.nome || '';
      document.getElementById('novoTelefone').value = op.telefone || '';
      document.getElementById('novoDocumento').value = op.documento || '';
      document.getElementById('novoCep1').value = op.cep1 || '';

      document.getElementById('tituloFormOperador').textContent = `✏️ Editando Operador: ${op.nome}`;
      document.getElementById('btnSalvarOperador').textContent = 'Atualizar Operador';
      document.getElementById('btnCancelarOperador').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicaoOperador() {
      document.getElementById('editOperadorId').value = '';
      document.getElementById('novoNome').value = '';
      document.getElementById('novoTelefone').value = '';
      document.getElementById('novoDocumento').value = '';
      document.getElementById('novoCep1').value = '';

      document.getElementById('tituloFormOperador').textContent = '➕ Cadastrar Novo Operador';
      document.getElementById('btnSalvarOperador').textContent = 'Salvar Operador';
      document.getElementById('btnCancelarOperador').classList.add('hidden');

    async function deletarOperador(id) {
      if (!verificarSeTemPermissaoEdicao()) return;
      if (confirm("Excluir operador e dados associados?")) {
        estado.operadores = estado.operadores.filter(o => o.id !== id);
        estado.apostas = estado.apostas.filter(a => (a.operadorId || a.clienteId) !== id);
        estado.casas = estado.casas.filter(cs => (cs.operadorId || cs.clienteId) !== id);
        delete estado.descontosOperadores[id];
        await deletarDaNuvemELocal('operador', id);
        atualizarSelectOperadores();
        atualizarSelectCasasGlobais();
        renderizarAba();
      }
    }

          const lucroAposta = a.retorno - a.stake;
          lucroGeralFinalizado += lucroAposta;

          const mesAno = a.data ? a.data.substring(0, 7) : 'Desconhecido';
          if (!lucroPorMes[mesAno]) {
            lucroPorMes[mesAno] = { lucro: 0, volume: 0, totalApostas: 0 };
          }
          lucroPorMes[mesAno].lucro += lucroAposta;
          lucroPorMes[mesAno].volume += a.stake;
          lucroPorMes[mesAno].totalApostas++;

          const casaObj = estado.casas.find(c => c.id === a.casaId);
          const nomeCasa = normalizarNomeCasa(casaObj ? casaObj.nome : 'Outras / N/A');
          if (!lucroPorCasa[nomeCasa]) {
            lucroPorCasa[nomeCasa] = { lucro: 0, volume: 0, totalApostas: 0 };
          }
          lucroPorCasa[nomeCasa].lucro += lucroAposta;
          lucroPorCasa[nomeCasa].volume += a.stake;
          lucroPorCasa[nomeCasa].totalApostas++;
        }
      });

      const mesesOrdenados = Object.keys(lucroPorMes).sort((a, b) => {
        return estado.ordemLucroMes === 'asc' ? a.localeCompare(b) : b.localeCompare(a);
      });
      const casasOrdenadas = Object.keys(lucroPorCasa).sort((a, b) => lucroPorCasa[b].lucro - lucroPorCasa[a].lucro);

      container.innerHTML = `

          </div>
          <div class="bg-panel border border-linha rounded-xl p-5">

    // ================= 6. ABA DE PAGAMENTO =================
    function renderizarPagamentos(container) {
      const usuarioLogado = obterUsuarioLogado();
      const ehAdmin = usuarioLogado && usuarioLogado.perfil === 'editor';

      let operadorIdAlvo = '';
      if (ehAdmin) {
        operadorIdAlvo = estado.filtros.operadorId || '';
      } else {
        const opDoUser = estado.operadores.find(op => op.nome.toLowerCase() === usuarioLogado.nome.toLowerCase() || op.id === usuarioLogado.operadorId);
        if (opDoUser) operadorIdAlvo = opDoUser.id;
      }

      const dataInicio = estado.filtros.dataInicio || '';
      const dataFim = estado.filtros.dataFim || '';
      const casaFiltro = estado.filtros.casaId || '';

      const apostasPagamento = estado.apostas.filter(a => {
        const opId = a.operadorId || a.clienteId;
        if (operadorIdAlvo && opId !== operadorIdAlvo) return false;
        if (casaFiltro && a.casaId !== casaFiltro) return false;
        if (dataInicio && a.data < dataInicio) return false;
        if (dataFim && a.data > dataFim) return false;
        return true;
      });

      let resultadoLiquidoBruto = 0;
      apostasPagamento.forEach(a => {
        if (a.finalizada && a.retorno !== null) {
          resultadoLiquidoBruto += (a.retorno - a.stake);
        }
      });

      const pctDesconto = (ehAdmin && operadorIdAlvo) ? (estado.descontosOperadores[operadorIdAlvo] || 0) : 0;
      const valorDesconto = (ehAdmin && operadorIdAlvo) ? (resultadoLiquidoBruto * (pctDesconto / 100)) : 0;
      const totalLiquidoAPagar = resultadoLiquidoBruto - valorDesconto;
      
      const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=00020126360014BR.GOV.BCB.PIX0114008436963975204000053039865405${Math.max(0, totalLiquidoAPagar).toFixed(2)}5802BR5925FABIO%20WELLINGTON%20VENTURA%20M6009FORTALEZA62070503***6304`;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 no-print">
          <div>
            <h2 class="text-xl md:text-2xl font-bold text-texto" style="color: var(--color-text);">💳 Gestão de Pagamentos</h2>

            🖨️ Imprimir / Salvar PDF
          </button>
        </div>

        ${ehAdmin ? `
          <div class="bg-panel border border-linha rounded-xl p-4 mb-6 no-print">
            <h3 class="text-xs font-bold text-texto mb-3 uppercase tracking-wider">⚙️ Configurar Desconto/Taxa por Operador (Visível apenas para Admin)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
              <div>
                <label class="block text-xs text-mutado mb-1">Selecione o Operador:</label>
                <select id="selectOpDescontoAdmin" onchange="trocarOperadorDescontoAdmin(this.value)" class="w-full px-3 py-2 bg-input border border-linha rounded text-texto text-xs outline-none">
                  <option value="">Selecione...</option>
                  ${estado.operadores.map(op => `<option value="${op.id}" ${operadorIdAlvo === op.id ? 'selected' : ''}>${op.nome}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs text-mutado mb-1">Desconto / Taxa (%):</label>
                <input type="number" step="0.1" min="0" max="100" id="inputDescontoValorAdmin" value="${operadorIdAlvo ? (estado.descontosOperadores[operadorIdAlvo] || 0) : 0}" class="w-full px-3 py-2 bg-input border border-linha rounded text-texto text-xs outline-none" placeholder="Ex: 10">
              </div>
              <div>
                <button onclick="salvarDescontoOperadorAdmin()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded text-xs transition">
                  Salvar Desconto para este Operador
                </button>
              </div>
            </div>
          </div>
        ` : ''}

        <div class="bg-panel border border-linha rounded-xl p-4 md:p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
          <div>
            <p class="text-[10px] uppercase text-mutado font-bold mb-1">Operador em Apuração:</p>
            <h3 class="text-sm md:text-base font-bold text-emerald-500 uppercase tracking-wider">${operadorIdAlvo ? estado.operadores.find(o => o.id === operadorIdAlvo)?.nome : 'Todos / Não selecionado'}</h3>
          </div>
          <div class="text-right bg-panelAlt p-3 rounded-lg border border-linha">
            <p class="text-[10px] uppercase text-mutado font-bold mb-1">LÍQUIDO A PAGAR</p>
            <h3 class="text-xl md:text-2xl font-black ${totalLiquidoAPagar >= 0 ? 'text-emerald-500' : 'text-red-500'}">
              R$ ${totalLiquidoAPagar.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
            </h3>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-panel border border-linha rounded-xl p-6 flex flex-col items-center justify-center text-center">
            <h3 class="text-xs font-bold text-texto uppercase tracking-wider mb-4">📷 QR Code PIX</h3>
            <div class="bg-white p-3 rounded-xl shadow-lg mb-4 inline-block">
              <img src="${qrCodeUrl}" alt="QR Code PIX" class="w-48 h-48 object-contain">
            </div>
            <p class="text-[11px] text-mutado mb-2">Escaneie com o aplicativo do seu banco</p>
            <div class="text-[10px] text-gray-300 font-mono select-all bg-input border border-linha p-3 rounded w-full break-all max-w-[300px]">
              CPF: 008.436.963-97<br>
              Banco: C6 BANK<br>
              Titular: FABIO WELLINGTON VENTURA M

          <div class="bg-panel border border-linha rounded-xl p-6 flex flex-col justify-start">

              </div>
              
              ${ehAdmin ? `
                <div class="flex justify-between py-2 border-b border-linha">
                  <span class="text-mutado">Desconto / Taxa Aplicada (${pctDesconto}%):</span>

                </div>
              ` : ''}

              <div class="flex justify-between py-3 mt-2 text-base">
                <span class="font-bold text-texto">Total Líquido:</span>
                <span class="font-black ${totalLiquidoAPagar >= 0 ? 'text-emerald-500' : 'text-red-500'}">R$ ${Math.max(0, totalLiquidoAPagar).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function trocarOperadorDescontoAdmin(opId) {
      const inputVal = document.getElementById('inputDescontoValorAdmin');
      if (inputVal) {
        inputVal.value = opId ? (estado.descontosOperadores[opId] || 0) : 0;
      }
    }

    function salvarDescontoOperadorAdmin() {
      const selectOp = document.getElementById('selectOpDescontoAdmin');
      const inputVal = document.getElementById('inputDescontoValorAdmin');
      if (!selectOp || !selectOp.value) {
        alert("Selecione um operador primeiro.");
        return;
      }
      const opId = selectOp.value;
      const desconto = parseFloat(inputVal.value) || 0;
      estado.descontosOperadores[opId] = desconto;
      salvarDadosNoLocalStorage();
      alert("Desconto salvo para este operador com sucesso!");
      renderizarAba();
    }

    function renderizarBackup(container) {
      if (!verificarSeTemPermissaoEdicao()) {
        container.innerHTML = `<div class="p-6 bg-red-500/10 border border-red-500/20 text-red-500 rounded-xl text-center">Acesso restrito a administradores.</div>`;
        return;
      }

      container.innerHTML = `
        <div class="mb-6">
          <h2 class="text-xl md:text-2xl font-bold text-texto" style="color: var(--color-text);">💾 Backup & Importação de Dados</h2>
          <p class="text-xs text-mutado">Exporte ou importe todos os registros do BetControl via arquivo JSON.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-panel border border-linha rounded-xl p-6 flex flex-col justify-between">
            <div>
              <h3 class="text-sm font-bold text-texto mb-2">📥 Exportar Dados (Backup)</h3>
              <p class="text-xs text-mutado mb-4">Baixe um arquivo contendo operadores, casas, apostas e usuários do sistema.</p>
            </div>
            <button onclick="exportarBackupJSON()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition">
              Baixar Arquivo JSON
            </button>
          </div>

          <div class="bg-panel border border-linha rounded-xl p-6 flex flex-col justify-between">
            <div>
              <h3 class="text-sm font-bold text-texto mb-2">📤 Importar Dados (Restaurar)</h3>
              <p class="text-xs text-mutado mb-4">Selecione um arquivo JSON de backup válido para restaurar as informações.</p>
              <input type="file" id="inputFileBackup" accept=".json" class="w-full text-xs text-mutado file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer mb-3">
            </div>
            <button onclick="importarBackupJSON()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition">
              Restaurar Dados do Arquivo
            </button>
          </div>
        </div>
      `;
    }

    function exportarBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(estado, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `betcontrol_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarBackupJSON() {
      const fileInput = document.getElementById('inputFileBackup');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Selecione um arquivo JSON primeiro.");
        return;
      }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const dadosImportados = JSON.parse(e.target.result);
          if (dadosImportados && dadosImportados.usuarios) {
            estado = dadosImportados;
            salvarDadosNoLocalStorage();
            alert("Backup restaurado com sucesso!");
            window.location.reload();
          } else {
            alert("Arquivo de backup inválido.");
          }
        } catch (err) {
          alert("Erro ao ler o arquivo JSON.");
        }
      };
      reader.readAsText(file);
    }

                ` : `
                  <div class="mt-3 flex flex-wrap items-center gap-1.5 text-xs text-mutado">
                    <span class="font-bold text-texto">Permissões ativas:</span>
                    ${u.perfil === 'editor' ? '<span class="bg-amber-500/20 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">Acesso Total (Editor)</span>' : (permissoesAtuais.length === 0 ? '<span class="text-mutado">Nenhuma aba permitida</span>' : permissoesAtuais.map(p => `<span class="bg-panelAlt text-texto border border-linha px-2 py-0.5 rounded text-[10px] font-bold uppercase">${p}</span>`).join(''))}
                  </div>
                `}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    async function salvarNovoUsuario(e) {
      e.preventDefault();
      const usuarioLogado = obterUsuarioLogado();
      if (!usuarioLogado || usuarioLogado.perfil !== 'editor') {
        alert("Apenas administradores podem cadastrar novos usuários.");
        return;
      }

      const userLogin = document.getElementById('novoUserLogin').value.trim();
      const nomeVal = document.getElementById('novoUserNome').value.trim();
      const senhaVal = document.getElementById('novoUserSenha').value.trim();
      const perfilVal = document.getElementById('novoUserPerfil').value;

      if (estado.usuarios.some(u => u.usuario === userLogin)) {
        alert("Este nome de usuário já existe.");
        return;
      }

      const novoUsr = {
        id: `usr-${Date.now()}`,
        usuario: userLogin,
        nome: nomeVal,
        senha: senhaVal,
        perfil: perfilVal,
        permissoesLeitor: perfilVal === 'editor' ? [] : ['dashboard', 'volumemes', 'relatorios', 'lucro']
      };

      estado.usuarios.push(novoUsr);
      await salvarNaNuvemELocal('usuario', novoUsr);
      renderizarAba();
    }

    function habilitarEdicaoUsuario(id) {
      const u = estado.usuarios.find(item => item.id === id);
      if (u) {
        u.editandoPermissoes = true;
        renderizarAba();
      }
    }

    function cancelarEdicaoUsuario(id) {
      const u = estado.usuarios.find(item => item.id === id);
      if (u) {
        u.editandoPermissoes = false;
        renderizarAba();
      }
    }

    async function salvarEdicaoUsuario(id) {
      const u = estado.usuarios.find(item => item.id === id);
      if (!u) return;

      const inputSenha = document.getElementById(`input-senha-${id}`);
      if (inputSenha) {
        u.senha = inputSenha.value.trim();
      }

      if (u.perfil !== 'editor') {
        const checkboxes = document.querySelectorAll(`.perm-check-${id}:checked`);
        const novasPermissoes = [];
        checkboxes.forEach(cb => novasPermissoes.push(cb.value));
        u.permissoesLeitor = novasPermissoes;
      }

      u.editandoPermissoes = false;
      await salvarNaNuvemELocal('usuario', u);
      alert("Alterações salvas com sucesso!");
      renderizarAba();
    }

    async function deletarUsuario(id) {
      const usuarioLogado = obterUsuarioLogado();
      if (!usuarioLogado || usuarioLogado.perfil !== 'editor') {
        alert("Apenas administradores podem excluir usuários.");
        return;
      }

      if (confirm("Deseja excluir este usuário?")) {
        estado.usuarios = estado.usuarios.filter(u => u.id !== id);
        await deletarDaNuvemELocal('usuario', id);
        renderizarAba();
      }
    }
  </script>
</body>
</html>
