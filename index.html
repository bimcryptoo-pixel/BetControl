<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BetControl - Gestão Operacional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuração Dinâmica do Tailwind com Temas -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: 'var(--color-base)',
            panel: 'var(--color-panel)',
            panelAlt: 'var(--color-panel-alt)',
            input: 'var(--color-input)',
            texto: 'var(--color-text)',
            mutado: 'var(--color-text-muted)',
            linha: 'var(--color-border)',
          }
        }
      }
    }
  </script>

  <!-- Supabase JS Client & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    /* TEMAS DE CORES */
    :root, [data-theme="dark"] {
      --color-base: #090a0f;
      --color-panel: #131620;
      --color-panel-alt: #181c28;
      --color-input: #1a1f2e;
      --color-text: #ffffff;
      --color-text-muted: #9ca3af;
      --color-border: rgba(255, 255, 255, 0.1);
    }
    [data-theme="light"] {
      --color-base: #f3f4f6;
      --color-panel: #ffffff;
      --color-panel-alt: #f9fafb;
      --color-input: #e5e7eb;
      --color-text: #111827;
      --color-text-muted: #4b5563;
      --color-border: rgba(0, 0, 0, 0.15);
    }
    [data-theme="medium"] {
      --color-base: #1e293b;
      --color-panel: #334155;
      --color-panel-alt: #475569;
      --color-input: #0f172a;
      --color-text: #f8fafc;
      --color-text-muted: #cbd5e1;
      --color-border: rgba(255, 255, 255, 0.15);
    }

    body {
      background-color: var(--color-base);
      color: var(--color-text);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
      cursor: pointer;
      opacity: 0.8;
    }
    [data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* ============ IMPRESSÃO / PDF — padrão visual BetControl (compacto) ============ */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 7mm 12mm 7mm;
        @bottom-right {
          content: "Página " counter(page) " de " counter(pages);
          font-size: 7pt;
          color: #9ca3af;
        }
      }
      /* garante que as cores do tema saiam no papel */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header, aside, .no-print, #tela-login {
        display: none !important;
      }
      html, body, main {
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #090a0f !important;
        color: #ffffff !important;
        font-size: 8pt !important;
      }
      /* cabeçalho do relatório — visível só no impresso */
      .print-header {
        display: block !important;
        margin-bottom: 6px !important;
        padding: 6px 10px !important;
        background: linear-gradient(135deg, #064e3b 0%, #0f766e 55%, #0e7490 100%) !important;
        border-radius: 10px !important;
        color: #ffffff !important;
      }
      .print-header .print-brand {
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;
      }
      .print-header .print-logo {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 26px !important;
        height: 26px !important;
        border-radius: 7px !important;
        background: rgba(255,255,255,.16) !important;
        border: 1px solid rgba(255,255,255,.4) !important;
        font-weight: 900 !important;
        font-size: 10pt !important;
        color: #ffffff !important;
      }
      .print-header .print-title {
        font-weight: 900 !important;
        font-size: 10pt !important;
        color: #ffffff !important;
        line-height: 1.2 !important;
      }
      .print-header .print-sub {
        font-size: 7pt !important;
        color: #d1fae5 !important;
      }
      /* KPIs compactos: 6 cartões em uma única linha */
      .kpi-grid {
        display: grid !important;
        grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
        gap: 5px !important;
        margin-bottom: 6px !important;
      }
      .kpi-grid > div {
        padding: 5px 6px !important;
        border-radius: 7px !important;
      }
      .kpi-grid p { font-size: 6pt !important; margin-bottom: 1px !important; white-space: nowrap !important; }
      .kpi-grid h3 { font-size: 8.5pt !important; line-height: 1.15 !important; white-space: nowrap !important; }
      /* seções compactas */
      .print-card {
        margin-bottom: 6px !important;
        padding: 6px 8px !important;
        border-radius: 7px !important;
        background: #131620 !important;
        border: 1px solid rgba(255,255,255,.1) !important;
      }
      .print-card > h3 {
        font-size: 8pt !important;
        margin-bottom: 4px !important;
      }
      /* tabelas organizadas na folha */
      .overflow-x-auto { overflow: visible !important; }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 7.5pt !important;
        background: transparent !important;
      }
      thead { display: table-header-group !important; }
      tfoot { display: table-footer-group !important; }
      tr { break-inside: avoid !important; page-break-inside: avoid !important; }
      th {
        font-size: 7pt !important;
        padding: 4px 5px !important;
        text-transform: uppercase !important;
        letter-spacing: .04em !important;
        color: #ffffff !important;
        background: #181c28 !important;
        border-bottom: 2px solid #10b981 !important;
      }
      td {
        font-size: 7.5pt !important;
        padding: 3px 5px !important;
        border-bottom: 1px solid rgba(255,255,255,.08) !important;
      }
      /* tabela por casa: dados centralizados nas colunas */
      .tabela-casas th, .tabela-casas td { text-align: center !important; }
      .tabela-casas th { font-size: 6pt !important; padding: 2px 3px !important; }
      .tabela-casas td { font-size: 6.5pt !important; padding: 2px 4px !important; line-height: 1.15 !important; }
      /* tabela de apostas: compactação máxima para caber em menos páginas */
      .tabela-apostas th { font-size: 6pt !important; padding: 2px 3px !important; }
      .tabela-apostas td { font-size: 6pt !important; padding: 1px 3px !important; line-height: 1.1 !important; }
      /* selo da casa compacto na impressão — o selo grande esticava a altura da linha */
      .flag-casa {
        font-size: 6pt !important;
        padding: 0 3px !important;
        line-height: 1.5 !important;
        box-shadow: none !important;
        border-radius: 3px !important;
      }
    }
  </style>
</head>
<body class="bg-base text-texto min-h-screen flex flex-col">

  <script>
    const SUPABASE_URL = 'https://uxwuxlkvxubbknaffkca.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ALboDYr5YVBcsso2qH5mig_HlLFPfle';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let graficoVolumeInstancia = null; // Instância global do Chart.js para evitar sobreposição

    const DADOS_INICIAIS = {
      tema: 'dark',
      abaAtiva: 'dashboard',
      dataFormulario: new Date().toISOString().split('T')[0],
      descontosOperadores: {}, 
      ordemRelatorio: 'desc',
      ordemDashboard: 'desc',
      ordemVolumeMes: 'desc',
      ordemLucroMes: 'desc',
      filtroPendentes: false,
      filtros: { dataInicio: '', dataFim: '', operadorId: '', casaId: '', mes: '', ano: '' },
      usuarios: [
        { id: 'usr-1', usuario: 'admin', senha: '123456', perfil: 'editor', nome: 'Administrador Mestre', permissoesLeitor: [] },
        { id: 'usr-2', usuario: 'operador', senha: '123456', perfil: 'leitura', nome: 'Operador Padrão', permissoesLeitor: ['dashboard', 'volumemes', 'relatorios', 'lucro'] }
      ],
      operadores: [],
      casas: [],
      apostas: [],
      selecoes: []
    };

    let estado = carregarDadosDoLocalStorage();

    function aplicarTema() {
      document.documentElement.setAttribute('data-theme', estado.tema || 'dark');
      const select = document.getElementById('selectTema');
      if (select) select.value = estado.tema || 'dark';
    }
    
    aplicarTema();

    function mudarTema(novoTema) {
      estado.tema = novoTema;
      salvarDadosNoLocalStorage();
      aplicarTema();
      renderizarAba(); // Recarrega para atualizar as cores do gráfico se estiver no módulo Volume
    }

    function formatarDataBR(dataIso) {
      if (!dataIso) return '';
      const partes = dataIso.split('-');
      if (partes.length !== 3) return dataIso;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function normalizarNomeCasa(nome) {
      if (!nome) return 'OUTRAS / N/A';
      return nome.trim().replace(/\s+/g, ' ').toUpperCase();
    }

    function renderizarFlagCasa(nomeCasa) {
      if (!nomeCasa) return '<span class="text-mutado">N/A</span>';
      
      const nomeLimpo = normalizarNomeCasa(nomeCasa);
      let estilo = "background-color: #ffffff; color: #000000; border: 1px solid rgba(0,0,0,0.1);";

      if (/^HM\s*BETS$/i.test(nomeLimpo)) {
        estilo = "background-color: #f97316; color: #000000;";
      } else if (/^BET\s*ZAP$/i.test(nomeLimpo)) {
        estilo = "background-color: #22c55e; color: #000000;";
      } else if (/^BET\s*CERTA$/i.test(nomeLimpo)) {
        estilo = "background-color: #ff0000; color: #ffffff;";
      } else if (/^X\s*BETS$/i.test(nomeLimpo)) {
        estilo = "background-color: #800080; color: #ffffff;";
      } else if (/^GG\s*BETS$/i.test(nomeLimpo)) {
        estilo = "background-color: #ffffff; color: #000000;";
      }

      return `<span class="flag-casa px-2.5 py-1 rounded-md text-[11px] md:text-xs font-black inline-flex items-center shadow-sm uppercase" style="${estilo}">${nomeLimpo}</span>`;
    }

    function salvarDadosNoLocalStorage() {
      localStorage.setItem('betcontrol_dados', JSON.stringify(estado));
    }

    function carregarDadosDoLocalStorage() {
      const dadosSalvos = localStorage.getItem('betcontrol_dados');
      if (dadosSalvos) {
        try {
          const parsed = JSON.parse(dadosSalvos);
          if (!parsed.tema) parsed.tema = 'dark';
          if (!parsed.dataFormulario) parsed.dataFormulario = new Date().toISOString().split('T')[0];
          if (!parsed.filtros) parsed.filtros = { dataInicio: '', dataFim: '', operadorId: '', casaId: '', mes: '', ano: '' };
          if (parsed.filtros.casaId === undefined) parsed.filtros.casaId = '';
          if (!parsed.descontosOperadores) parsed.descontosOperadores = {};
          if (!parsed.ordemRelatorio) parsed.ordemRelatorio = 'desc';
          if (!parsed.ordemDashboard) parsed.ordemDashboard = 'desc';
          if (!parsed.ordemVolumeMes) parsed.ordemVolumeMes = 'desc';
          if (!parsed.ordemLucroMes) parsed.ordemLucroMes = 'desc';
          if (parsed.filtroPendentes === undefined) parsed.filtroPendentes = false;
          if (!parsed.selecoes) parsed.selecoes = [];
          if (!parsed.usuarios || parsed.usuarios.length === 0) {
            parsed.usuarios = [
              { id: 'usr-1', usuario: 'admin', senha: '123456', perfil: 'editor', nome: 'Administrador Mestre', permissoesLeitor: [] },
              { id: 'usr-2', usuario: 'operador', senha: '123456', perfil: 'leitura', nome: 'Operador Padrão', permissoesLeitor: ['dashboard', 'volumemes', 'relatorios', 'lucro'] }
            ];
          } else {
            parsed.usuarios.forEach(u => {
              if (!u.permissoesLeitor) u.permissoesLeitor = [];
            });
          }
          return parsed;
        } catch (e) {
          console.error('Erro ao ler do localStorage:', e);
        }
      }
      return DADOS_INICIAIS;
    }

    async function buscarTodosPaginado(tabela) {
      const lote = 1000;
      let inicio = 0;
      let todos = [];
      while (true) {
        const { data, error } = await supabaseClient.from(tabela).select('*').range(inicio, inicio + lote - 1);
        if (error) throw error;
        if (!data || data.length === 0) break;
        todos = todos.concat(data);
        if (data.length < lote) break;
        inicio += lote;
      }
      return todos;
    }

    async function carregarDadosDoServidorOuLocal() {
      try {
        const ops = await buscarTodosPaginado('operadores');
        const css = await buscarTodosPaginado('casas');
        const aps = await buscarTodosPaginado('apostas');
        const usrs = await buscarTodosPaginado('usuarios');
        let sels = [];
        try { sels = await buscarTodosPaginado('selecoes'); } catch (e) { console.warn('Tabela selecoes ainda não criada:', e); }

        if (ops) {
          estado.operadores = ops;
        }
        if (css) {
          estado.casas = css.map(c => ({ id: c.id, operadorId: c.operador_id, nome: c.nome }));
        }
        if (aps) {
          estado.apostas = aps.map(a => ({ 
            id: a.id, 
            operadorId: a.operador_id, 
            casaId: a.casa_id, 
            data: a.data, 
            stake: Number(a.stake), 
            retorno: a.retorno !== null ? Number(a.retorno) : null, 
            finalizada: a.finalizada,
            anexo_url: a.anexo_url || null,
            liquidada_em: a.liquidada_em || null,
            oddTotal: (a.odd_total !== null && a.odd_total !== undefined) ? Number(a.odd_total) : null
          }));
        }
        if (sels) {
          estado.selecoes = sels.map(s => ({
            id: s.id,
            apostaId: s.aposta_id,
            jogo: s.jogo,
            mercado: s.mercado || '',
            selecao: s.selecao,
            odd: Number(s.odd) || 1,
            status: s.status || 'pendente',
            detalhe: s.detalhe || ''
          }));
        }
        if (usrs && usrs.length > 0) {
          estado.usuarios = usrs.map(u => ({
            ...u,
            permissoesLeitor: u.permissoes_leitor ? (typeof u.permissoes_leitor === 'string' ? JSON.parse(u.permissoes_leitor) : u.permissoes_leitor) : (u.permissoesLeitor || [])
          }));
        }
        salvarDadosNoLocalStorage();
      } catch (erro) {
        console.warn("Modo Offline ativado: Usando cache local.", erro);
        estado = carregarDadosDoLocalStorage();
      }
      verificarAutenticacao();
    }

    async function salvarNaNuvemELocal(tipo, dadosObjeto) {
      salvarDadosNoLocalStorage();
      try {
        if (tipo === 'aposta') {
          await supabaseClient.from('apostas').upsert({
            id: dadosObjeto.id,
            operador_id: dadosObjeto.operadorId,
            casa_id: dadosObjeto.casaId,
            data: dadosObjeto.data,
            stake: dadosObjeto.stake,
            retorno: dadosObjeto.retorno,
            finalizada: dadosObjeto.finalizada,
            anexo_url: dadosObjeto.anexo_url || null,
            liquidada_em: dadosObjeto.liquidada_em || null,
            odd_total: dadosObjeto.oddTotal || null
          });
        } else if (tipo === 'selecao') {
          await supabaseClient.from('selecoes').upsert({
            id: dadosObjeto.id,
            aposta_id: dadosObjeto.apostaId,
            jogo: dadosObjeto.jogo,
            mercado: dadosObjeto.mercado || '',
            selecao: dadosObjeto.selecao,
            odd: dadosObjeto.odd || 1,
            status: dadosObjeto.status || 'pendente',
            detalhe: dadosObjeto.detalhe || ''
          });
        } else if (tipo === 'operador') {
          await supabaseClient.from('operadores').upsert({ id: dadosObjeto.id, nome: dadosObjeto.nome, documento: dadosObjeto.documento || '', telefone: dadosObjeto.telefone || '', cep1: dadosObjeto.cep1 || '', cep2: dadosObjeto.cep2 || '', cep3: dadosObjeto.cep3 || '', digitos: dadosObjeto.digitos || '' });
        } else if (tipo === 'casa') {
          await supabaseClient.from('casas').upsert({ id: dadosObjeto.id, operador_id: dadosObjeto.operadorId, nome: dadosObjeto.nome });
        } else if (tipo === 'usuario') {
          await supabaseClient.from('usuarios').upsert({ 
            id: dadosObjeto.id, 
            usuario: dadosObjeto.usuario, 
            senha: dadosObjeto.senha, 
            perfil: dadosObjeto.perfil, 
            nome: dadosObjeto.nome,
            permissoes_leitor: JSON.stringify(dadosObjeto.permissoesLeitor || [])
          });

      }

      salvarDadosNoLocalStorage();

        if (tipo === 'aposta') await supabaseClient.from('apostas').delete().eq('id', id);
        if (tipo === 'selecao') await supabaseClient.from('selecoes').delete().eq('id', id);
        if (tipo === 'operador') await supabaseClient.from('operadores').delete().eq('id', id);
        if (tipo === 'casa') await supabaseClient.from('casas').delete().eq('id', id);
        if (tipo === 'usuario') await supabaseClient.from('usuarios').delete().eq('id', id);

    function obterUsuarioLogado() {
      const username = localStorage.getItem('betcontrol_user_ativo');
      if (!username) return null;
      return estado.usuarios.find(u => u.usuario === username) || null;
    }

    function verificarSeTemPermissaoEdicao() {
      const usr = obterUsuarioLogado();
      if (!usr) return false;
      return usr.perfil === 'editor';
    }

    function verificarPermissaoAba(aba) {
      const usr = obterUsuarioLogado();
      if (!usr) return false;
      if (usr.perfil === 'editor') return true;
      if (aba === 'usuarios' || aba === 'backup') return false;
      const permissoes = usr.permissoesLeitor || [];
      return permissoes.includes(aba);
    }

    function realizarLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUsuario').value.trim();
      const pass = document.getElementById('loginSenha').value.trim();
      const erroDiv = document.getElementById('loginErro');

      const usuarioEncontrado = estado.usuarios.find(u => u.usuario === user && u.senha === pass);

      if (usuarioEncontrado) {
        localStorage.setItem('betcontrol_logado', 'true');
        localStorage.setItem('betcontrol_user_ativo', usuarioEncontrado.usuario);
        erroDiv.classList.add('hidden');
        verificarAutenticacao();
      } else {
        erroDiv.classList.remove('hidden');
      }
    }

    function realizarLogout() {
      localStorage.removeItem('betcontrol_logado');
      localStorage.removeItem('betcontrol_user_ativo');
      verificarAutenticacao();
    }

    function verificarAutenticacao() {
      const logado = localStorage.getItem('betcontrol_logado');
      const telaLogin = document.getElementById('tela-login');
      const appContainer = document.getElementById('app-container');

      if (logado === 'true') {
        const usr = obterUsuarioLogado();
        if (usr) {
          const elNome = document.getElementById('headerNomeUsuario');
          const elPerfil = document.getElementById('headerPerfilUsuario');
          if (elNome) elNome.textContent = usr.usuario;
          if (elPerfil) elPerfil.textContent = usr.perfil === 'editor' ? '✏️ Editor' : '👁️ Leitura';
          
          atualizarVisibilidadeMenuLateral(usr);

          if (!verificarPermissaoAba(estado.abaAtiva)) {
            const abasPossiveis = ['dashboard', 'volumemes', 'operadores', 'casas', 'relatorios', 'lucro', 'pagamentos', 'backup', 'usuarios'];
            const primeiraPermitida = abasPossiveis.find(a => verificarPermissaoAba(a));
            if (primeiraPermitida) {
              estado.abaAtiva = primeiraPermitida;
            } else {
              estado.abaAtiva = 'dashboard';
            }
          }
        }
        telaLogin.classList.add('hidden');
        appContainer.classList.remove('hidden');
        appContainer.classList.add('flex');
        atualizarSelectOperadores();
        atualizarSelectCasasGlobais();
        atualizarSelectAnos();
        restaurarFiltrosNaUI();
        renderizarAba();
      } else {
        appContainer.classList.remove('flex');
        appContainer.classList.add('hidden');
        telaLogin.classList.remove('hidden');
      }
    }

    function atualizarVisibilidadeMenuLateral(usr) {
      const mapaBotoes = {
        'dashboard': 'nav-dashboard',
        'volumemes': 'nav-volumemes',
        'operadores': 'nav-operadores',
        'casas': 'nav-casas',
        'relatorios': 'nav-relatorios',
        'lucro': 'nav-lucro',
        'pagamentos': 'nav-pagamentos',
        'backup': 'nav-backup',
        'usuarios': 'nav-usuarios'
      };

      Object.keys(mapaBotoes).forEach(aba => {
        const btnId = mapaBotoes[aba];
        const btnEl = document.getElementById(btnId);
        if (!btnEl) return;

        if (usr.perfil === 'editor') {
          btnEl.style.display = 'flex';
        } else {

            btnEl.style.display = 'none';
          } else if (aba === 'usuarios') {

          } else {
            if (usr.permissoesLeitor && usr.permissoesLeitor.includes(aba)) {

            } else {

            }
          }

    window.onload = async () => {
      aplicarTema();
      await carregarDadosDoServidorOuLocal();
      ativarTempoReal();
    };

    // ===== Atualização automática em tempo real (Supabase Realtime) =====
    // Quando a varredura de liquidação (ou outro operador) altera apostas/seleções
    // no banco, a página recarrega os dados sozinha — sem precisar de F5.
    let timerTempoReal = null;

    function ativarTempoReal() {
      try {
        supabaseClient.channel('betcontrol-mudancas')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'apostas' }, agendarRecarregamentoTempoReal)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'selecoes' }, agendarRecarregamentoTempoReal)
          .subscribe();
      } catch (e) { console.warn('Tempo real indisponível:', e); }
    }

    function podeRecarregarAgora() {
      // painel do bilhete ou visualizador de anexo abertos
      if (document.getElementById('painelBilhete') || document.getElementById('lightboxAnexo')) return false;
      // edição inline de aposta na lista
      if (estado.apostas && estado.apostas.some(a => a.editando)) return false;
      // formulário de nova aposta com conteúdo ainda não salvo
      const stake = document.getElementById('apostaStake');
      if (stake && stake.value && Number(stake.value) > 0) return false;
      const oddT = document.getElementById('apostaOddTotal');
      if (oddT && oddT.value) return false;
      if (document.querySelectorAll('#listaSelecoes [data-linha-selecao]').length > 0) return false;
      const pv = document.querySelector('[data-preview-anexo]');
      if (pv && pv.textContent.trim() !== '') return false;
      // usuário digitando em qualquer campo
      const el = document.activeElement;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return false;
      return true;
    }

    function agendarRecarregamentoTempoReal() {
      clearTimeout(timerTempoReal);
      // debounce: a varredura faz vários PATCHes seguidos; espera 2s de silêncio
      timerTempoReal = setTimeout(recarregarAposMudancaTempoReal, 2000);
    }

    async function recarregarAposMudancaTempoReal() {
      if (!podeRecarregarAgora()) {
        // não interrompe quem está digitando/editando: tenta de novo em 30s
        timerTempoReal = setTimeout(recarregarAposMudancaTempoReal, 30000);
        return;
      }
      await carregarDadosDoServidorOuLocal();
      mostrarAvisoTempoReal('🔄 Dados atualizados automaticamente');
    }

    function mostrarAvisoTempoReal(texto) {
      let el = document.getElementById('avisoTempoReal');
      if (!el) {
        el = document.createElement('div');
        el.id = 'avisoTempoReal';
        el.className = 'fixed bottom-4 right-4 z-[200] bg-emerald-600 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none';
        document.body.appendChild(el);
      }
      el.textContent = texto;
      el.classList.remove('opacity-0');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('opacity-0'), 4000);
    }

    function restaurarFiltrosNaUI() {
      if (estado.filtros) {
        const di = document.getElementById('filtroDataInicio');
        const df = document.getElementById('filtroDataFim');
        const fm = document.getElementById('filtroMes');
        const fa = document.getElementById('filtroAno');
        if (di) di.value = estado.filtros.dataInicio || '';
        if (df) df.value = estado.filtros.dataFim || '';
        if (fm) fm.value = estado.filtros.mes || '';
        if (fa && estado.filtros.ano) fa.value = estado.filtros.ano;
      }
    }

    function atualizarFiltrosGlobais() {
      estado.filtros = {
        dataInicio: document.getElementById('filtroDataInicio').value,
        dataFim: document.getElementById('filtroDataFim').value,
        operadorId: document.getElementById('selectOperador').value,
        casaId: document.getElementById('selectCasaGlobal').value,
        mes: document.getElementById('filtroMes') ? document.getElementById('filtroMes').value : '',
        ano: document.getElementById('filtroAno') ? document.getElementById('filtroAno').value : ''
      };
      salvarDadosNoLocalStorage();
      renderizarAba();
    }

    // Filtro independente por MÊS/ANO: preenche o intervalo DE/ATÉ com o mês (ou ano) cheio,
    // então vale automaticamente para todo o sistema (dashboard, relatórios, lucro, PDF).
    function aplicarFiltroMesAno() {
      const mes = document.getElementById('filtroMes').value;
      let ano = document.getElementById('filtroAno').value;
      const di = document.getElementById('filtroDataInicio');
      const df = document.getElementById('filtroDataFim');
      if (!mes && !ano) {
        di.value = '';
        df.value = '';
      } else {
        if (!ano) ano = String(new Date().getFullYear()); // só mês escolhido → usa o ano atual
        if (mes) {
          const ultimoDia = new Date(parseInt(ano, 10), parseInt(mes, 10), 0).getDate();
          di.value = `${ano}-${mes}-01`;
          df.value = `${ano}-${mes}-${String(ultimoDia).padStart(2, '0')}`;
        } else {
          di.value = `${ano}-01-01`;
          df.value = `${ano}-12-31`;
        }
      }
      atualizarFiltrosGlobais();
    }

    // Quando o usuário ajusta DE/ATÉ manualmente, o atalho mês/ano deixa de valer
    function aoMudarDataManual() {
      const fm = document.getElementById('filtroMes');
      const fa = document.getElementById('filtroAno');
      if (fm) fm.value = '';
      if (fa) fa.value = '';
      atualizarFiltrosGlobais();
    }

    // Anos disponíveis vindos das apostas cadastradas (+ ano atual)
    function atualizarSelectAnos() {
      const sel = document.getElementById('filtroAno');
      if (!sel) return;
      const anos = new Set([String(new Date().getFullYear())]);
      (estado.apostas || []).forEach(a => {
        if (a.data && /^\d{4}/.test(a.data)) anos.add(a.data.slice(0, 4));
      });
      const ordenados = [...anos].sort().reverse();
      const atual = sel.value || (estado.filtros && estado.filtros.ano) || '';
      sel.innerHTML = '<option value="">Todos</option>' + ordenados.map(a => `<option value="${a}">${a}</option>`).join('');
      if (atual && ordenados.includes(atual)) sel.value = atual;
    }

    function atualizarSelectOperadores() {

      if (!select) return;
      const usr = obterUsuarioLogado();

      select.innerHTML = '<option value="">Todos os Operadores</option>';

        ? estado.operadores.filter(op => op.nome.toLowerCase() === usr.nome.toLowerCase() || op.id === usr.operadorId)
        : estado.operadores;

        option.textContent = op.nome;

    function filtrarApostasPorGeral(apostas) {
      const usr = obterUsuarioLogado();
      let apostasBase = apostas;

      if (usr && usr.perfil !== 'editor') {
        const operadoresDoLeitor = estado.operadores.filter(op => op.nome.toLowerCase() === usr.nome.toLowerCase() || op.id === usr.operadorId);
        const idsOpValidos = operadoresDoLeitor.map(op => op.id);
        apostasBase = apostas.filter(a => {
          const opId = a.operadorId || a.clienteId;
          return idsOpValidos.includes(opId);
        });
      }

      if (estado.filtroPendentes && estado.abaAtiva === 'dashboard') {
        return apostasBase.filter(a => {
          const opId = a.operadorId || a.clienteId;
          const operadorFiltro = estado.filtros ? estado.filtros.operadorId : '';
          const casaFiltro = estado.filtros ? estado.filtros.casaId : '';
          if (operadorFiltro && opId !== operadorFiltro) return false;
          if (casaFiltro && a.casaId !== casaFiltro) return false;
          return !a.finalizada;
        });
      }

      const operadorFiltro = estado.filtros ? estado.filtros.operadorId : '';
      const casaFiltro = estado.filtros ? estado.filtros.casaId : '';
      const dataInicio = estado.filtros ? estado.filtros.dataInicio : '';
      const dataFim = estado.filtros ? estado.filtros.dataFim : '';

      return apostasBase.filter(a => {
        const opId = a.operadorId || a.clienteId;
        if (operadorFiltro && opId !== operadorFiltro) return false;
        if (casaFiltro && a.casaId !== casaFiltro) return false;
        if (dataInicio && a.data < dataInicio) return false;
        if (dataFim && a.data > dataFim) return false;
        return true;
      });
    }

    async function sincronizarTudoManual() {
      const btn = document.getElementById('btnSincronizarManual');
      if (btn) {
        btn.innerHTML = '⏳ Sincronizando...';
        btn.disabled = true;
      }
      
      salvarDadosNoLocalStorage();
      
      try {
        for (const op of estado.operadores) {
          await supabaseClient.from('operadores').upsert({ id: op.id, nome: op.nome, documento: op.documento || '', telefone: op.telefone || '', cep1: op.cep1 || '', cep2: op.cep2 || '', cep3: op.cep3 || '', digitos: op.digitos || '' });
        }
        for (const casa of estado.casas) {
          await supabaseClient.from('casas').upsert({ id: casa.id, operador_id: casa.operadorId, nome: casa.nome });
        }
        for (const aposta of estado.apostas) {
          await supabaseClient.from('apostas').upsert({
            id: aposta.id,
            operador_id: aposta.operadorId,
            casa_id: aposta.casaId,
            data: aposta.data,
            stake: aposta.stake,
            retorno: aposta.retorno,
            finalizada: aposta.finalizada,
            anexo_url: aposta.anexo_url || null
          });
        }
        if (verificarSeTemPermissaoEdicao()) {
            for (const u of estado.usuarios) {
              await supabaseClient.from('usuarios').upsert({ 
                id: u.id, 
                usuario: u.usuario, 
                senha: u.senha, 
                perfil: u.perfil, 
                nome: u.nome,
                permissoes_leitor: JSON.stringify(u.permissoesLeitor || [])
              });
            }
        }
        
        alert("✅ Todos os dados foram salvos e sincronizados com a nuvem com sucesso!");
      } catch (erro) {
        console.error("Erro na sincronização:", erro);
        alert("⚠️ Houve um erro ao sincronizar com a nuvem. Seus dados estão protegidos localmente.");
      } finally {
        if (btn) {
          btn.innerHTML = '💾 Salvar Tudo (Sincronizar)';
          btn.disabled = false;
        }
      }
    }

    function renderizarAba() {
      const main = document.getElementById('conteudo-principal');
      if (!verificarPermissaoAba(estado.abaAtiva)) {
        main.innerHTML = `<div class="p-6 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl text-center">Acesso negado a esta seção.</div>`;
        return;
      }

      if (estado.abaAtiva === 'dashboard') renderizarDashboard(main);
      else if (estado.abaAtiva === 'volumemes') renderizarVolumeMes(main);
      else if (estado.abaAtiva === 'operadores') renderizarOperadores(main);
      else if (estado.abaAtiva === 'casas') renderizarCasas(main);
      else if (estado.abaAtiva === 'relatorios') renderizarRelatorios(main);
      else if (estado.abaAtiva === 'lucro') renderizarLucro(main);
      else if (estado.abaAtiva === 'pagamentos') renderizarPagamentos(main);
      else if (estado.abaAtiva === 'backup') renderizarBackup(main);
      else if (estado.abaAtiva === 'usuarios') renderizarUsuarios(main);
    }

      const m = String(a && a.id || '').match(/aposta-(\d{10,})/);
      return m ? parseInt(m[1], 10) : 0;
    }

        return estado.ordemDashboard === 'asc' ? tsCriacaoAposta(a) - tsCriacaoAposta(b) : tsCriacaoAposta(b) - tsCriacaoAposta(a);

    // ================= 1.1 MÓDULO VOLUME MÊS =================
    function renderizarVolumeMes(container) {
      const apostasFiltradas = filtrarApostasPorGeral(estado.apostas);

      const dadosPorData = {};
      let volumeTotalGeral = 0;
      let lucroLiquidoTotalGeral = 0;
      let totalQtdApostasGeral = apostasFiltradas.length;

      apostasFiltradas.forEach(a => {
        const dataAposta = a.data || 'Sem Data';
        const stakeAposta = a.stake || 0;
        let lucroLiquidoAposta = 0;

        if (a.finalizada && a.retorno !== null) {
          lucroLiquidoAposta = a.retorno - a.stake;
        }

        volumeTotalGeral += stakeAposta;
        lucroLiquidoTotalGeral += lucroLiquidoAposta;

        if (!dadosPorData[dataAposta]) {
          dadosPorData[dataAposta] = {
            data: dataAposta,
            volumeDia: 0,
            lucroLiquidoDia: 0,
            quantidade: 0,
            casasNoDia: new Set()
          };
        }

        dadosPorData[dataAposta].volumeDia += stakeAposta;
        dadosPorData[dataAposta].lucroLiquidoDia += lucroLiquidoAposta;
        dadosPorData[dataAposta].quantidade += 1;

        const casaObj = estado.casas.find(c => c.id === a.casaId);
        if (casaObj) {
          dadosPorData[dataAposta].casasNoDia.add(normalizarNomeCasa(casaObj.nome));
        }
      });

      const datasOrdenadas = Object.keys(dadosPorData).sort((a, b) => {
        return estado.ordemVolumeMes === 'asc' ? new Date(a) - new Date(b) : new Date(b) - new Date(a);
      });

      // Preparação de dados para o Gráfico (sempre cronológico)
      const datasCronologicas = Object.keys(dadosPorData).sort((a, b) => new Date(a) - new Date(b));
      const labelsGrafico = [];

          function gradienteBicolor(chart, corAcima, corAbaixo) {

    // ================= ANEXOS (bilhetes) =================
    function comprimirImagem(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const maxDim = 1600;
          let width = img.width, height = img.height;
          if (Math.max(width, height) > maxDim) {
            const escala = maxDim / Math.max(width, height);
            width = Math.round(width * escala);
            height = Math.round(height * escala);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('Falha ao comprimir imagem')), 'image/jpeg', 0.82);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Arquivo de imagem inválido.')); };
        img.src = url;
      });
    }

    async function enviarAnexo(file) {
      if (!file.type.startsWith('image/')) throw new Error('O anexo precisa ser uma imagem.');
      const blob = await comprimirImagem(file);
      const nome = `apostas/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await supabaseClient.storage.from('anexos').upload(nome, blob, { contentType: 'image/jpeg' });
      if (error) throw error;
      const { data } = supabaseClient.storage.from('anexos').getPublicUrl(nome);
      return data.publicUrl;
    }

    async function excluirArquivoAnexo(url) {
      try {
        const partes = (url || '').split('/anexos/');
        if (partes.length < 2) return;
        await supabaseClient.storage.from('anexos').remove([partes[1]]);
      } catch (e) { console.warn('Falha ao excluir arquivo antigo do anexo:', e); }
    }

    // Correção manual do status de uma perna (só perfil editor).
    // Recalcula o retorno da aposta com as MESMAS regras da liquidação automática:
    // simples GREEN = stake×odd | múltipla com qualquer RED = 0 | VOID conta como 1 | tudo VOID devolve a stake.
    // REGRA (usuário, 30/09/2026): múltipla com 1 perna RED já está perdida — liquida NA HORA
    // (retorno 0, finalizada), sem esperar as demais pernas; as pendentes seguem pendentes
    // e se resolvem nas varreduras seguintes apenas para registro.
    async function corrigirSelecaoManual(apostaId, selecaoId, novoStatus) {
      if (!verificarSeTemPermissaoEdicao()) return;
      const aposta = (estado.apostas || []).find(x => x.id === apostaId);
      const sel = (estado.selecoes || []).find(x => x.id === selecaoId);
      if (!aposta || !sel) return;
      const rotulos = { green: 'GREEN', red: 'RED', void: 'VOID', pendente: 'PENDENTE' };
      if (!confirm(`Marcar "${sel.selecao}" como ${rotulos[novoStatus]}?\nO retorno da aposta será recalculado.`)) return;
      sel.status = novoStatus;
      const agora = new Date();
      const carimbo = agora.toLocaleString('pt-BR');
      sel.detalhe = (sel.detalhe ? sel.detalhe + ' · ' : '') + `Correção manual (${rotulos[novoStatus]} em ${carimbo})`;
      await salvarNaNuvemELocal('selecao', sel);
      const sels = obterSelecoesAposta(apostaId);
      const stake = Number(aposta.stake) || 0;
      const temPendente = sels.some(s => s.status === 'pendente');
      const temRed = sels.some(s => s.status === 'red');
      const ehMultipla = sels.length > 1;
      if (ehMultipla && temRed) {
        // Múltipla com perna RED já está perdida: liquida na hora, sem esperar as demais.
        aposta.retorno = 0;
        aposta.finalizada = true;
        aposta.liquidada_em = agora.toISOString();
      } else if (temPendente || sels.length === 0) {
        aposta.retorno = null;
        aposta.finalizada = false;
        aposta.liquidada_em = null;
      } else if (sels.length === 1) {
        const s = sels[0];
        if (s.status === 'green') aposta.retorno = +(stake * Number(s.odd)).toFixed(2);
        else if (s.status === 'red') aposta.retorno = 0;
        else aposta.retorno = +stake.toFixed(2);
        aposta.finalizada = true;
        aposta.liquidada_em = agora.toISOString();
      } else {
        if (temRed) {
          aposta.retorno = 0;
        } else if (sels.every(s => s.status === 'void')) {
          aposta.retorno = +stake.toFixed(2);
        } else {
          const oddBilhete = (aposta.oddTotal !== null && aposta.oddTotal !== undefined && aposta.oddTotal !== '') ? Number(aposta.oddTotal) : null;
          const odd = oddBilhete !== null ? oddBilhete : calcularOddTotal(sels);
          aposta.retorno = +(stake * odd).toFixed(2);
        }
        aposta.finalizada = true;
        aposta.liquidada_em = agora.toISOString();
      }
      await salvarNaNuvemELocal('aposta', aposta);
      abrirPainelBilhete(apostaId);
      if (typeof renderizarAba === 'function') renderizarAba();
    }

    function badgeStatusSelecao(status) {
      if (status === 'green') return '<span class="bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded text-[10px] font-bold">🟢 GREEN</span>';
      if (status === 'red') return '<span class="bg-red-500/20 text-red-600 dark:text-red-400 px-2 py-0.5 rounded text-[10px] font-bold">🔴 RED</span>';
      if (status === 'void') return '<span class="bg-gray-500/20 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-[10px] font-bold">➖ VOID</span>';
      return '<span class="bg-yellow-500/20 text-yellow-600 dark:text-yellow-400 px-2 py-0.5 rounded text-[10px] font-bold">⏳ PENDENTE</span>';
    }

    // Perna pendente de aposta JÁ finalizada = só histórico (não trava nada) — 01/10/2026
    function badgeLegBilhete(aposta, s) {
      if (aposta && aposta.finalizada && s.status === 'pendente')

      const oddTotalTxt = sels.length

      let badgeGeral;

      else if (geral === 'red') badgeGeral = '<span class="bg-red-500 text-white px-4 py-1.5 rounded-full text-sm font-bold">🔴 RED</span>';
      else if (geral === 'void') badgeGeral = '<span class="bg-gray-500 text-white px-4 py-1.5 rounded-full text-sm font-bold">➖ VOID</span>';
      else if (geral === 'pendente') badgeGeral = '<span class="bg-yellow-500 text-black px-4 py-1.5 rounded-full text-sm font-bold">⏳ PENDENTE</span>';
      else badgeGeral = '<span class="bg-gray-500/30 text-mutado px-4 py-1.5 rounded-full text-sm font-bold">📋 SEM SELEÇÕES</span>';

      const retornoTxt = a.retorno !== null && a.retorno !== undefined
        ? `R$ ${Number(a.retorno).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`
        : '-';

      const linhas = sels.map(s => `
        <div class="bg-panelAlt border border-linha rounded-lg p-4">
          <div class="flex items-start justify-between gap-2 mb-1">
            <div class="font-semibold text-texto text-sm">${s.selecao} <span class="text-emerald-500">@ ${Number(s.odd).toLocaleString('pt-BR', { minimumFractionDigits: 3 })}</span></div>

          </div>
          <div class="text-xs text-mutado">${s.jogo}</div>
          ${s.mercado ? `<div class="text-xs text-mutado">${s.mercado}</div>` : ''}
          ${s.detalhe ? `<div class="text-xs mt-1 text-texto opacity-80">📊 ${s.detalhe}</div>` : ''}
          ${verificarSeTemPermissaoEdicao() ? `<div class="flex gap-1 mt-2 items-center">
            <button onclick="corrigirSelecaoManual('${apostaId}', '${s.id}', 'green')" title="Marcar GREEN" class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold hover:bg-emerald-500 hover:text-white transition">🟢</button>
            <button onclick="corrigirSelecaoManual('${apostaId}', '${s.id}', 'red')" title="Marcar RED" class="text-[10px] px-2 py-0.5 rounded bg-red-500/20 text-red-400 font-bold hover:bg-red-500 hover:text-white transition">🔴</button>
            <button onclick="corrigirSelecaoManual('${apostaId}', '${s.id}', 'void')" title="Marcar VOID" class="text-[10px] px-2 py-0.5 rounded bg-gray-500/20 text-gray-300 font-bold hover:bg-gray-500 hover:text-white transition">➖</button>
            <button onclick="corrigirSelecaoManual('${apostaId}', '${s.id}', 'pendente')" title="Voltar para PENDENTE" class="text-[10px] px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-400 font-bold hover:bg-yellow-500 hover:text-black transition">⏳</button>
          </div>` : ''}
        </div>`).join('');

      const liquidadaTxt = a.liquidada_em
        ? new Date(a.liquidada_em).toLocaleString('pt-BR')
        : (a.finalizada ? '✓ liquidada' : 'aguardando resultado');

      const overlay = document.createElement('div');
      overlay.id = 'painelBilhete';
      overlay.className = 'fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 overflow-y-auto';
      overlay.onclick = (e) => { if (e.target === overlay) fecharPainelBilhete(); };
      overlay.innerHTML = `
        <div class="relative bg-panel border border-linha rounded-2xl max-w-4xl w-full my-8 p-5 md:p-8 shadow-2xl" onclick="event.stopPropagation()">
          <button onclick="fecharPainelBilhete()" class="absolute top-3 right-4 text-mutado text-2xl font-bold hover:text-red-400">✕</button>
          <div class="mb-4">
            <h3 class="text-lg font-bold" style="color: var(--color-text);">🎫 Bilhete</h3>
            <div class="mt-2">${badgeGeral}</div>
          </div>
          ${a.anexo_url ? `
            <div class="text-center mb-4">
              <img src="${a.anexo_url}" alt="Bilhete anexado" class="max-h-80 w-auto mx-auto rounded-lg shadow-lg cursor-zoom-in" onclick="abrirAnexo('${a.anexo_url}')">
              <div class="text-xs text-mutado mt-1">clique na imagem para ampliar</div>
            </div>` : ''}
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4 text-center">
            <div class="bg-panelAlt border border-linha rounded-lg p-2.5"><div class="text-xs text-mutado">Stake</div><div class="text-sm font-bold text-texto">R$ ${Number(a.stake).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div></div>
            <div class="bg-panelAlt border border-linha rounded-lg p-2.5"><div class="text-xs text-mutado">Odd total</div><div class="text-sm font-bold text-texto">${oddTotalTxt}</div></div>
            <div class="bg-panelAlt border border-linha rounded-lg p-2.5"><div class="text-xs text-mutado">Retorno</div><div class="text-sm font-bold text-texto">${retornoTxt}</div></div>
            <div class="bg-panelAlt border border-linha rounded-lg p-2.5"><div class="text-xs text-mutado">Casa</div><div class="text-sm font-bold text-texto">${casa ? casa.nome : 'N/A'}</div></div>
          </div>
          ${sels.length ? `<div class="space-y-2 mb-4">${linhas}</div>` : '<p class="text-xs text-mutado mb-4">Nenhuma seleção registrada para esta aposta.</p>'}
          ${a.finalizada && sels.some(s => s.status === 'pendente') ? '<p class="text-[11px] text-slate-400 mb-4">📜 Pernas marcadas como HISTÓRICO pertencem a um bilhete já finalizado e são resolvidas apenas para registro.</p>' : ''}
          <div class="border-t border-linha pt-3 text-xs text-mutado space-y-1">
            <div>📝 Registrada em ${formatarDataBR(a.data)} ${operador ? `· ${operador.nome}` : ''}</div>
            <div>${a.finalizada || geral === 'green' || geral === 'red' ? '✅' : '⏳'} Liquidada: ${liquidadaTxt}</div>

        </div>`;
      document.body.appendChild(overlay);
    }

    // ================= SELEÇÕES DO BILHETE =================
    function obterSelecoesAposta(apostaId) {
      return (estado.selecoes || []).filter(s => s.apostaId === apostaId);
    }

    function calcularOddTotal(selecoes) {
      return (selecoes || [])
        .filter(s => s.status !== 'void')
        .reduce((acc, s) => acc * (Number(s.odd) || 1), 1);
    }

    function statusGeralSelecoes(selecoes) {
      if (!selecoes || selecoes.length === 0) return 'sem-selecoes';
      if (selecoes.some(s => s.status === 'red')) return 'red';
      if (selecoes.some(s => s.status === 'pendente')) return 'pendente';
      if (selecoes.every(s => s.status === 'void')) return 'void';
      return 'green';
    }

        </div>
        <div class="col-span-2 sm:col-span-1 text-right">
          <button type="button" onclick="this.closest('[data-linha-selecao]').remove()" title="Remover linha" class="px-2 py-1.5 text-red-500 hover:text-red-400 text-sm">✕</button>
        </div>`;
      lista.appendChild(linha);
      linha.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => marcarLinhaIncompleta(linha)));

    // Destaca linhas de seleção com jogo vazio (erro comum do OCR) — 01/10/2026
    function marcarLinhaIncompleta(linha) {
      if (!linha) return;
      const jogo = (linha.querySelector('[data-campo="jogo"]') || {}).value || '';
      const selecao = (linha.querySelector('[data-campo="selecao"]') || {}).value || '';
      const odd = (linha.querySelector('[data-campo="odd"]') || {}).value || '';
      const incompleta = !jogo.trim() && (!!selecao.trim() || !!odd.trim());
      linha.classList.toggle('border-red-500', incompleta);
      linha.classList.toggle('bg-red-500/5', incompleta);
      let aviso = linha.querySelector('[data-aviso-jogo]');
      if (incompleta && !aviso) {
        aviso = document.createElement('div');
        aviso.setAttribute('data-aviso-jogo', '');
        aviso.className = 'col-span-12 text-[10px] text-red-400 font-bold';
        aviso.textContent = '⚠️ Preencha o jogo desta seleção (o OCR não conseguiu ler).';
        linha.appendChild(aviso);
      } else if (!incompleta && aviso) {
        aviso.remove();
      }
    }

    // Aviso de bilhete duplicado — NÃO bloqueia (duplicadas podem ser intencionais) — 01/10/2026
    function existeBilheteDuplicado(data, stake, oddTotal, selecoes) {
      const norm = s => String(s || '').trim().toLowerCase();
      const chaveSel = selecoes.map(s => [norm(s.jogo), norm(s.mercado), norm(s.selecao), Number(s.odd) || 1].join('|')).sort().join(';;');
      if (!chaveSel) return false;
      return (estado.apostas || []).some(a => {
        if (a.data !== data) return false;
        if (Number(a.stake) !== Number(stake)) return false;
        const otA = (a.oddTotal !== null && a.oddTotal !== undefined && a.oddTotal !== '') ? Number(a.oddTotal) : null;
        const otB = (oddTotal !== null && oddTotal !== undefined && oddTotal !== '') ? Number(oddTotal) : null;
        if (otA !== otB) return false;
        const selsA = obterSelecoesAposta(a.id).map(s => [norm(s.jogo), norm(s.mercado), norm(s.selecao), Number(s.odd) || 1].join('|')).sort().join(';;');
        return selsA === chaveSel;
      });
    }

    function coletarSelecoesForm(listaId) {
      const id = listaId || 'listaSelecoes';
      const linhas = document.querySelectorAll('#' + CSS.escape(id) + ' [data-linha-selecao]');
      const out = [];

        const mercado = (l.querySelector('[data-campo="mercado"]') || {}).value || '';
        const selecao = (l.querySelector('[data-campo="selecao"]') || {}).value || '';

        if (jogo.trim() || selecao.trim()) {

    // Remove a foto anexada e limpa as linhas/odd lidas — garante área de anexo vazia
    function limparAnexoBilhete() {

    async function salvarSelecoesAposta(apostaId, lista) {
      for (const s of lista) {
        const nova = {
          id: `sel-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          apostaId,

          odd: s.odd || 1,
          status: 'pendente',
          detalhe: ''
        };

    async function removerSelecao(selId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      if (!confirm('Remover esta seleção do bilhete?')) return;
      estado.selecoes = (estado.selecoes || []).filter(s => s.id !== selId);
      await deletarDaNuvemELocal('selecao', selId);
      salvarDadosNoLocalStorage();

    }

    function adicionarLinhaSelecaoEdicao(apostaId) {
      adicionarLinhaSelecao(null, `edit-sels-new-${apostaId}`);
    }

    // ---- OCR do bilhete (sugestão automática das seleções) ----
    // Suporta dois layouts: (A) jogo, mercado, seleção+odd / (B) seleção+odd, mercado, jogo (ex: Bet Zap).
    // A odd é sempre o ÚLTIMO número da linha; linhas de total (Tripla/Dupla/Simples) são ignoradas.

    // Remove artefatos típicos do OCR no fim/início do texto: traços soltos ("Partida ——"),
    // fragmentos curtos com "?" ("Opções Ec?"), "?" perdido, bullets etc.
    function limparTextoOCR(s) {
      let t = String(s || '').replace(/\s+/g, ' ').trim();
      t = t.replace(/^[●•\-–—_~?!;\s]+/, '');          // sujeira no início
      t = t.replace(/(\s+[A-Za-zÀ-ÿ]{1,3})?\?$/, '');  // "Opções Ec?" / "Opções?" -> "Opções"
      t = t.replace(/[\s\-–—_~:;]+$/, '');             // "Partida ——" -> "Partida"
      return t.trim();
    }
    // Parser de bilhete (v2, 30/09/2026): ancora nas ODDS, não nos jogos.
    // Cobre: odd grudada na seleção ("sel 1.83"), odd solta na linha de baixo,
    // armadilha do handicap ("mais de 18.5" + odd "1.83" separada) e linha de
    // total ("Tripla 6.78") que vira a odd total do bilhete. Se não achar nada,
    // cai no método antigo (ancorado no jogo) como fallback.
    function parseTextoBilhete(texto) {
      const linhas = (texto || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const reDec = /(\d{1,3}[.,]\d{2,3})/g;
      const reTotal = /^(tripla|dupla|simples|m[uú]ltipla|acumulada|acumulador)\b/i;
      const reJogo = /([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.\- ']{2,}?)\s+[xX×]\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.\- ']{2,})/;
      const ehCabecalho = l => /^(aposta|bilhete|comprovante|cupom|stake|valor|data)\b/i.test(l) && l.length < 25;
      const limpaInicio = l => l.replace(/^[×xX<|\-–—\s]+/, '').trim();
      const ehLinhaTotal = l => reTotal.test(limpaInicio(l));
      const tiraAposta = l => l.replace(/\|\s*Aposta\s*\|?/gi, ' ').replace(/\s+/g, ' ').trim();

      const decimais = (linha) => {
        const out = []; let m; reDec.lastIndex = 0;
        while ((m = reDec.exec(linha)) !== null) out.push({ num: m[1].replace(',', '.'), index: m.index });
        return out;
      };
      const ehOddSozinha = (l) => {
        if (reTotal.test(limpaInicio(l))) return false;
        const t = tiraAposta(l);
        if (!/\d[.,]\d/.test(t)) return false;
        const semLetras = t.replace(/[A-Za-zÀ-ÿ]/g, '').trim();
        return /^[\d.,\s|]+$/.test(semLetras) && /\d/.test(semLetras);
      };

      const n = linhas.length;
      const consumida = new Array(n).fill(false);
      const resultado = [];

      // odd total do bilhete: "Tripla 6.78" (ou "Tripla" + odd sozinha na próxima linha)
      let oddTotalBilhete = '';
      for (let i = 0; i < n; i++) {
        if (!ehLinhaTotal(linhas[i])) continue;
        const decs = decimais(linhas[i]);
        if (decs.length) { oddTotalBilhete = decs[decs.length - 1].num; consumida[i] = true; break; }
        let j = i + 1;
        while (j < n && ehCabecalho(linhas[j])) j++;
        if (j < n && ehOddSozinha(linhas[j])) {
          const d2 = decimais(linhas[j]);
          if (d2.length) { oddTotalBilhete = d2[d2.length - 1].num; consumida[i] = true; consumida[j] = true; break; }
        }
        consumida[i] = true; break;
      }

      const proxLivre = (i) => { let j = i; while (j < n && (consumida[j] || ehCabecalho(linhas[j]))) j++; return j < n ? j : -1; };
      const antLivre = (i) => { let j = i; while (j >= 0 && (consumida[j] || ehCabecalho(linhas[j]) || ehLinhaTotal(linhas[j]))) j--; return j >= 0 ? j : -1; };
      const ehJogo = (l) => reJogo.test(l) && !/^\d/.test(l.trim());

      // pernas ancoradas na odd
      for (let i = 0; i < n; i++) {
        if (consumida[i] || ehCabecalho(linhas[i]) || ehLinhaTotal(linhas[i])) continue;
        const linha = linhas[i];
        const decs = decimais(linha);
        if (!decs.length) continue;
        const last = decs[decs.length - 1];
        const antes = limpaInicio(tiraAposta(linha.slice(0, last.index)));
        let odd = '', selecao = '', idxSel = i, oddNaLinha = true;

        if (antes.replace(/[\d.,\s]/g, '').length >= 2) {
          const j = proxLivre(i + 1);
          if (j !== -1 && ehOddSozinha(linhas[j])) {
            // armadilha do "mais de 18.5": a odd real está sozinha na próxima linha
            const d2 = decimais(linhas[j]);
            odd = d2[d2.length - 1].num;
            selecao = limpaInicio(tiraAposta(linha));
            consumida[j] = true;
          } else {
            odd = last.num;
            selecao = antes;
          }
        } else {
          // odd "solta": pertence à seleção da linha anterior
          const p = antLivre(i - 1);
          if (p === -1) continue;
          odd = last.num;
          oddNaLinha = false;
          selecao = limpaInicio(tiraAposta(linhas[p]));
          idxSel = p;
          consumida[p] = true;
        }
        consumida[i] = true;
        if (!selecao || !odd) continue;

        // jogo: odd na linha da seleção → busca pra frente; odd solta → busca pra trás primeiro.
        // jogos já usados por outra perna não são reaproveitados.
        let jogo = '', idxJogo = -1;
        const achaJogoFrente = () => {
          for (let k = idxSel + 1; k <= idxSel + 3 && k < n; k++) {
            if (consumida[k] || ehLinhaTotal(linhas[k])) continue;
            if (ehJogo(linhas[k])) return k;
          }
          return -1;
        };
        const achaJogoTras = () => {
          for (let k = idxSel - 1; k >= idxSel - 3 && k >= 0; k--) {
            if (consumida[k] || ehLinhaTotal(linhas[k])) continue;
            if (ehJogo(linhas[k])) return k;
          }
          return -1;
        };
        if (oddNaLinha) idxJogo = achaJogoFrente();
        else { idxJogo = achaJogoTras(); if (idxJogo === -1) idxJogo = achaJogoFrente(); }
        if (idxJogo !== -1) { jogo = linhas[idxJogo].trim(); consumida[idxJogo] = true; }

        // mercado: primeira linha relevante entre a seleção e o jogo
        let mercado = '';
        const fimM = idxJogo !== -1 ? idxJogo : idxSel + 3;
        if (idxJogo !== -1 && idxJogo < idxSel) {
          for (let k = idxJogo + 1; k < idxSel && k < n; k++) {
            if (consumida[k] || ehLinhaTotal(linhas[k]) || ehCabecalho(linhas[k])) continue;
            const t = tiraAposta(linhas[k]).trim();
            if (t && !ehOddSozinha(linhas[k])) { mercado = t; break; }
          }
        } else {
          for (let k = idxSel + 1; k < fimM && k < n; k++) {
            if (consumida[k] || ehLinhaTotal(linhas[k]) || ehCabecalho(linhas[k])) continue;
            const t = tiraAposta(linhas[k]).trim();
            if (t && !ehOddSozinha(linhas[k])) { mercado = t; break; }
          }
        }
        resultado.push({ jogo: jogo, mercado: mercado, selecao: selecao, odd: odd });
      }
      if (resultado.length === 0) return parseTextoBilheteLegado(texto);
      return { linhas: resultado, oddTotal: oddTotalBilhete };
    }

    function parseTextoBilheteLegado(texto) {
      const linhas = (texto || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const resultado = [];
      const reJogo = /([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.\- ']{2,}?)\s+[xX×]\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.\- ']{2,})/;
      const reOddGlobal = /(\d{1,2}[.,]\d{2,3})/g;
      const reTotal = /^(tripla|dupla|simples|m[uú]ltipla|acumulada|acumulador)\b/i;
      const ehCabecalho = l => /^(aposta|bilhete|comprovante|cupom|total|stake|valor|data)\b/i.test(l) && l.length < 25;
      const ehLinhaTotal = l => reTotal.test(l.replace(/^[×xX]\s*/, '').trim());

      const extrairOdd = (linha) => {
        let m, ultimo = null;
        reOddGlobal.lastIndex = 0;
        while ((m = reOddGlobal.exec(linha)) !== null) ultimo = m;
        if (!ultimo) return null;
        return { odd: ultimo[1].replace(',', '.'), indice: ultimo.index };
      };

      const idxJogos = [];
      linhas.forEach((linha, i) => {
        if (ehCabecalho(linha)) return;
        if (linha.match(reJogo) && !/^\d/.test(linha)) idxJogos.push(i);
      });

      idxJogos.forEach((gi, k) => {
        const jogo = linhas[gi].trim();
        const inicio = k === 0 ? 0 : idxJogos[k - 1] + 1;
        const fimBloco = k + 1 < idxJogos.length ? idxJogos[k + 1] : linhas.length;
        let selecao = '', odd = '', mercado = '';

        // procura a linha da odd: primeiro para trás (layout B), depois para frente (layout A)
        let linhaOdd = -1, paraFrente = false;
        for (let i = gi - 1; i >= inicio && i >= gi - 3; i--) {
          if (ehCabecalho(linhas[i]) || ehLinhaTotal(linhas[i])) continue;
          if (extrairOdd(linhas[i])) { linhaOdd = i; break; }
        }
        if (linhaOdd === -1) {
          for (let i = gi + 1; i < fimBloco && i <= gi + 3; i++) {
            if (ehCabecalho(linhas[i]) || ehLinhaTotal(linhas[i])) continue;
            if (extrairOdd(linhas[i])) { linhaOdd = i; paraFrente = true; break; }
          }
        }
        if (linhaOdd !== -1) {
          const info = extrairOdd(linhas[linhaOdd]);
          odd = info.odd;
          selecao = linhas[linhaOdd].slice(0, info.indice).replace(/^[×xX]\s*/, '').trim();
          const a = paraFrente ? gi + 1 : linhaOdd + 1;
          const b = paraFrente ? linhaOdd : gi;
          for (let i = a; i < b; i++) {
            const t = linhas[i].trim();
            if (t && !ehCabecalho(t) && !extrairOdd(t) && !ehLinhaTotal(t)) { mercado = t; break; }
          }
        }
        if (jogo || selecao) resultado.push({ jogo: jogo, mercado: mercado, selecao: selecao, odd: odd });
      });
      // odd total do bilhete: linha "Tripla/Dupla/Simples/Múltipla <odd>" — manda no financeiro, não pode divergir
      let oddTotalBilhete = '';
      for (const linha of linhas) {
        if (ehLinhaTotal(linha)) {
          const info = extrairOdd(linha);
          if (info) { oddTotalBilhete = info.odd; break; }
        }
      }
      return { linhas: resultado, oddTotal: oddTotalBilhete };
    }

    // Amplia a imagem 2x num canvas antes do OCR: pontos decimais pequenos
    // (ex: a odd "2.75" lida como "275") são a causa mais comum de perna
    // incompleta (lê o jogo mas não completa mercado/seleção/odd).
    function prepararImagemOCR(arquivo) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(arquivo);
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth || 0, h = img.naturalHeight || 0;
            const ampliar = w > 0 && w < 2600 && h > 0 && h < 2600;
            if (!ampliar) { URL.revokeObjectURL(url); resolve(arquivo); return; }
            const canvas = document.createElement('canvas');
            canvas.width = w * 2; canvas.height = h * 2;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            resolve(canvas);
          } catch (e) { URL.revokeObjectURL(url); resolve(arquivo); }
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(arquivo); };
        img.src = url;
      });
    }

    async function lerBilheteOCR() {
      const st = document.getElementById('ocrStatus');
      const btn = document.getElementById('btnLerBilhete');
      const input = document.getElementById('apostaAnexo');
      const arquivo = input && input.files && input.files[0];
      if (!arquivo) {
        if (st) st.textContent = '⚠️ Anexe a foto do bilhete primeiro (clique, arraste ou Ctrl+V).';
        return;
      }
      if (typeof Tesseract === 'undefined') {
        if (st) st.textContent = '⚠️ Leitor indisponível (sem conexão com a internet). Preencha as linhas manualmente.';
        return;
      }
      try {
        if (btn) { btn.disabled = true; btn.textContent = '⏳ Lendo bilhete...'; }
        if (st) st.textContent = '⏳ Lendo o bilhete, aguarde...';
        const fonteOCR = await prepararImagemOCR(arquivo);
        let { data } = await Tesseract.recognize(fonteOCR, 'por');
        let parsed = parseTextoBilhete(data.text || '');
        // se não achou nenhuma perna COM odd, tenta uma vez na imagem original
        // (proteção contra regressão em bilhetes que já liam bem sem ampliação)
        const temOdd = (p) => p && p.linhas && p.linhas.some(l => l.odd);
        if (!temOdd(parsed) && fonteOCR !== arquivo) {
          if (st) st.textContent = '⏳ Tentando outra resolução...';
          const retry = await Tesseract.recognize(arquivo, 'por');
          const parsed2 = parseTextoBilhete(retry.data.text || '');
          if (temOdd(parsed2)) { data = retry.data; parsed = parsed2; }
        }
        const linhas = (parsed && parsed.linhas) || [];
        // limpa artefatos do OCR nos textos antes de exibir para conferência
        linhas.forEach(l => {
          l.jogo = limparTextoOCR(l.jogo);
          l.mercado = limparTextoOCR(l.mercado);
          l.selecao = limparTextoOCR(l.selecao);
        });
        const nLinhasTexto = (data.text || '').split('\n').filter(l => l.trim()).length;
        const inputOddTotal = document.getElementById('apostaOddTotal');
        if (inputOddTotal && parsed.oddTotal) inputOddTotal.value = parsed.oddTotal;
        if (linhas.length === 0) {
          if (st) st.textContent = `⚠️ Não identifiquei as pernas (li ${nLinhasTexto} linhas da foto). Se a foto está nítida, atualize a página (Ctrl+Shift+R) e tente de novo — ou preencha manualmente.`;
        } else {
          linhas.forEach(l => adicionarLinhaSelecao(l));
          const extra = parsed.oddTotal ? ` (odd total do bilhete: ${parsed.oddTotal})` : '';
          if (st) st.textContent = `✅ ${linhas.length} ${linhas.length === 1 ? 'linha identificada' : 'linhas identificadas'}${extra} — confira e ajuste se preciso.`;
        }
      } catch (e) {
        console.error('OCR:', e);
        if (st) st.textContent = '⚠️ Falha na leitura. Preencha as linhas manualmente.';
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🤖 Ler do bilhete'; }
      }
    }

    // ---- Zona de anexo: clique, arrastar/soltar e colar (Ctrl+V) ----
    function mostrarPreviewAnexo(input, previewEl) {
      const f = input.files && input.files[0];
      previewEl.textContent = f ? `✅ ${f.name} (${Math.round(f.size / 1024)} KB)` : '';
    }

    function definirArquivoAnexo(input, file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      const zona = input.closest('[data-drop-anexo]');
      const preview = zona && zona.querySelector('[data-preview-anexo]');
      if (preview) mostrarPreviewAnexo(input, preview);
    }

    function limparDestaqueZonasAnexo() {
      document.querySelectorAll('[data-drop-anexo]').forEach(z => z.classList.remove('border-emerald-500', 'bg-emerald-500/10'));
    }

    document.addEventListener('click', (e) => {
      const zona = e.target.closest && e.target.closest('[data-drop-anexo]');
      if (zona && !(e.target.closest && e.target.closest('button'))) {
        const input = document.getElementById(zona.getAttribute('data-drop-anexo'));
        if (input) input.click();
      }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t && t.id && (t.id === 'apostaAnexo' || t.id.indexOf('input-anexo-') === 0)) {
        const zona = t.closest('[data-drop-anexo]');
        const preview = zona && zona.querySelector('[data-preview-anexo]');
        if (preview) mostrarPreviewAnexo(t, preview);
      }
    });

    document.addEventListener('dragover', (e) => {
      const zona = e.target.closest && e.target.closest('[data-drop-anexo]');
      if (zona) {
        e.preventDefault();
        limparDestaqueZonasAnexo();
        zona.classList.add('border-emerald-500', 'bg-emerald-500/10');
      }
    });

    document.addEventListener('dragleave', () => limparDestaqueZonasAnexo());

    document.addEventListener('drop', (e) => {
      const zona = e.target.closest && e.target.closest('[data-drop-anexo]');
      limparDestaqueZonasAnexo();
      if (!zona) return;
      e.preventDefault();
      const arquivos = e.dataTransfer && e.dataTransfer.files;
      const img = arquivos && Array.from(arquivos).find(f => f.type.indexOf('image/') === 0);
      const input = document.getElementById(zona.getAttribute('data-drop-anexo'));
      if (input && img) definirArquivoAnexo(input, img);
    });

    document.addEventListener('paste', (e) => {
      if (!estado || estado.abaAtiva !== 'dashboard') return;
      const arquivos = e.clipboardData && e.clipboardData.files;
      const img = arquivos && Array.from(arquivos).find(f => f.type.indexOf('image/') === 0);
      if (!img) return;
      const apostaEditando = (estado.apostas || []).find(a => a.editando);
      const inputId = apostaEditando ? `input-anexo-${apostaEditando.id}` : 'apostaAnexo';
      const input = document.getElementById(inputId);
      if (!input) return;
      e.preventDefault();
      definirArquivoAnexo(input, img);
    });

    async function adicionarAposta(event) {
      event.preventDefault();
      if (!verificarSeTemPermissaoEdicao()) return;
      const operadorId = document.getElementById('apostaOperador').value;
      const casaId = document.getElementById('apostaCasa').value;
      const stake = parseFloat(document.getElementById('apostaStake').value);
      const dataAposta = document.getElementById('apostaData').value;
      const qtd = parseInt(document.getElementById('apostaQtd').value) || 1;
      const oddTotalInput = document.getElementById('apostaOddTotal');
      const oddTotalForm = oddTotalInput && oddTotalInput.value !== '' ? parseFloat(oddTotalInput.value) : null;

      if (!casaId) {
        alert("Cadastre uma casa de apostas para este operador primeiro.");
        return;
      }

      estado.dataFormulario = dataAposta;

      // Validações (01/10/2026): jogo obrigatório por seleção; aviso se sem seleções; aviso de duplicada
      const temLinhaSemJogo = Array.from(document.querySelectorAll('#listaSelecoes [data-linha-selecao]')).some(l => {
        const jogo = (l.querySelector('[data-campo="jogo"]') || {}).value || '';
        const selecao = (l.querySelector('[data-campo="selecao"]') || {}).value || '';
        const odd = (l.querySelector('[data-campo="odd"]') || {}).value || '';
        return !jogo.trim() && (!!selecao.trim() || !!odd.trim());
      });
      if (temLinhaSemJogo) {
        alert("⚠️ Há seleções sem o campo JOGO preenchido (marcadas em vermelho). Preencha o jogo antes de salvar — a liquidação automática precisa dele.");
        return;
      }
      const selecoesForm = coletarSelecoesForm();
      if (selecoesForm.length === 0) {
        if (!confirm("Salvar esta aposta SEM seleções? Ela não será liquidada automaticamente e ficará como manual.")) return;
      } else if (existeBilheteDuplicado(dataAposta, stake, oddTotalForm, selecoesForm)) {
        if (!confirm("⚠️ Já existe um bilhete idêntico lançado nesta data (mesmo stake e seleções). Duplicadas podem ser intencionais — salvar mesmo assim?")) return;
      }

      let anexoUrl = null;
      const arquivoAnexo = document.getElementById('apostaAnexo') && document.getElementById('apostaAnexo').files[0];
      if (arquivoAnexo) {
        try {
          anexoUrl = await enviarAnexo(arquivoAnexo);
        } catch (e) {
          console.error(e);
          alert("⚠️ Não foi possível enviar a imagem do bilhete. Tente novamente.");
          return;
        }
      }

      for (let i = 0; i < qtd; i++) {
        const novaAposta = {
          id: `aposta-${Date.now()}-${i}`,
          operadorId,
          casaId,
          data: dataAposta,
          stake,
          retorno: null,
          finalizada: false,
          anexo_url: anexoUrl,
          liquidada_em: null,
          oddTotal: oddTotalForm
        };
        estado.apostas.push(novaAposta);
        await salvarNaNuvemELocal('aposta', novaAposta);
        if (selecoesForm.length > 0) {
          await salvarSelecoesAposta(novaAposta.id, selecoesForm);
        }
      }

      const inputAnexo = document.getElementById('apostaAnexo');
      if (inputAnexo) {
        inputAnexo.value = '';
        const zona = inputAnexo.closest('[data-drop-anexo]');
        const pv = zona && zona.querySelector('[data-preview-anexo]');
        if (pv) pv.textContent = '';
      }
      limparSelecoesForm();
      renderizarAba();
    }

    async function salvarEdicaoAposta(apostaId) {
      if (!verificarSeTemPermissaoEdicao()) return;
      const inputCasa = document.getElementById(`input-casa-${apostaId}`);
      const inputStake = document.getElementById(`input-stake-${apostaId}`);
      const inputRetorno = document.getElementById(`input-retorno-${apostaId}`);
      
      const aposta = estado.apostas.find(a => a.id === apostaId);
      if (aposta) {
        if (inputCasa) aposta.casaId = inputCasa.value;
        if (inputStake && inputStake.value !== '') aposta.stake = parseFloat(inputStake.value);
        const inputOddTotal = document.getElementById(`input-odd-total-${apostaId}`);
        if (inputOddTotal) aposta.oddTotal = inputOddTotal.value !== '' ? parseFloat(inputOddTotal.value) : null;
        if (inputRetorno && inputRetorno.value !== '') {
          aposta.retorno = parseFloat(inputRetorno.value);
          aposta.finalizada = true;
        } else if (inputRetorno && inputRetorno.value === '') {
          aposta.retorno = null;
          aposta.finalizada = false;
        }
        const inputAnexo = document.getElementById(`input-anexo-${apostaId}`);
        if (inputAnexo && inputAnexo.files && inputAnexo.files[0]) {
          try {
            const novaUrl = await enviarAnexo(inputAnexo.files[0]);
            if (aposta.anexo_url) await excluirArquivoAnexo(aposta.anexo_url);
            aposta.anexo_url = novaUrl;
          } catch (e) {
            console.error(e);
            alert("⚠️ Não foi possível enviar a nova imagem. As outras alterações foram salvas.");
          }
        }
        aposta.editando = false;
        const novasSelsEdicao = coletarSelecoesForm(`edit-sels-new-${apostaId}`);
        if (novasSelsEdicao.length > 0) {
          await salvarSelecoesAposta(apostaId, novasSelsEdicao);
        }
        await salvarNaNuvemELocal('aposta', aposta);
        renderizarAba();
      }
    }

    async function adicionarCasa(e) {
      e.preventDefault();
      if (!verificarSeTemPermissaoEdicao()) return;
      const nomeCasa = document.getElementById('casaNome').value.trim();
      // Trava anti-duplicada: mesma casa com caixa/espaço diferente não pode ser recadastrada
      const normalizado = nomeCasa.toLowerCase().replace(/\s+/g, ' ').trim();
      const jaExiste = estado.casas.some(c => (c.nome || '').toLowerCase().replace(/\s+/g, ' ').trim() === normalizado);
      if (jaExiste) {
        alert(`A casa "${nomeCasa}" já está cadastrada. Use o cadastro existente.`);
        return;
      }
      const novaCasa = {
        id: `casa-${Date.now()}`,
        operadorId: null,
        nome: nomeCasa
      };
      estado.casas.push(novaCasa);
      await salvarNaNuvemELocal('casa', novaCasa);
      atualizarSelectCasasGlobais();
      renderizarAba();
    }

    async function deletarCasa(id) {
      if (!verificarSeTemPermissaoEdicao()) return;
      if (confirm("Deletar esta casa de apostas?")) {
        estado.casas = estado.casas.filter(c => c.id !== id);
        await deletarDaNuvemELocal('casa', id);
        atualizarSelectCasasGlobais();
        renderizarAba();
      }
    }

    // ================= 4. RELATÓRIOS (CORRIGIDO: AGRUPAMENTO E OPERADOR) =================

        return estado.ordemRelatorio === 'asc' ? tsCriacaoAposta(a) - tsCriacaoAposta(b) : tsCriacaoAposta(b) - tsCriacaoAposta(a);

          if (a.retorno > a.stake) greens++;
          else if (a.retorno < a.stake) reds++;
        }
      });

      const casasDetalhadasOrdenadas = Object.values(resumoPorCasa).sort((a, b) => b.lucroLiquido - a.lucroLiquido);

      const roi = volumeTotal > 0 ? ((lucroTotal / volumeTotal) * 100).toFixed(2) : '0.00';

    // ================= 5. MÓDULO LUCRO =================
    function renderizarLucro(container) {
      const apostasFiltradas = filtrarApostasPorGeral(estado.apostas);

      const lucroPorMes = {};
      const lucroPorCasa = {};

      let lucroGeralFinalizado = 0;
      let volumeGeral = 0;

      apostasFiltradas.forEach(a => {
        volumeGeral += a.stake;
        if (a.finalizada && a.retorno !== null) {
          const lucroAposta = a.retorno - a.stake;
          lucroGeralFinalizado += lucroAposta;

          const mesAno = a.data ? a.data.substring(0, 7) : 'Desconhecido';
          if (!lucroPorMes[mesAno]) {
            lucroPorMes[mesAno] = { lucro: 0, volume: 0, totalApostas: 0, greens: 0, reds: 0 };
          }
          lucroPorMes[mesAno].lucro += lucroAposta;
          lucroPorMes[mesAno].volume += a.stake;
          lucroPorMes[mesAno].totalApostas++;
          if (lucroAposta > 0) lucroPorMes[mesAno].greens++;
          else if (lucroAposta < 0) lucroPorMes[mesAno].reds++;

          const casaObj = estado.casas.find(c => c.id === a.casaId);
          const nomeCasa = normalizarNomeCasa(casaObj ? casaObj.nome : 'Outras / N/A');
          if (!lucroPorCasa[nomeCasa]) {
            lucroPorCasa[nomeCasa] = { lucro: 0, volume: 0, totalApostas: 0 };
          }
          lucroPorCasa[nomeCasa].lucro += lucroAposta;
          lucroPorCasa[nomeCasa].volume += a.stake;
          lucroPorCasa[nomeCasa].totalApostas++;
        }
      });

      const mesesOrdenados = Object.keys(lucroPorMes).sort((a, b) => {
        return estado.ordemLucroMes === 'asc' ? a.localeCompare(b) : b.localeCompare(a);
      });
      const casasOrdenadas = Object.keys(lucroPorCasa).sort((a, b) => lucroPorCasa[b].lucro - lucroPorCasa[a].lucro);

      // Casas disponíveis para o filtro do módulo (globais, unificadas)
      const casasDisponiveisLucro = estado.casas;
      const casaFiltroLucro = estado.filtros ? estado.filtros.casaId : '';
      const nomeCasaFiltro = casaFiltroLucro ? (estado.casas.find(c => c.id === casaFiltroLucro) || {}).nome || '' : '';

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 no-print">
          <div>
            <h2 class="text-xl md:text-2xl font-bold text-texto" style="color: var(--color-text);">💰 Dashboard de Lucratividade</h2>

          <div class="flex flex-wrap items-center gap-2">
            <select id="selectLucroCasa" onchange="filtrarLucroPorCasa(this.value)" title="Filtrar por casa" class="px-2.5 py-2 bg-panel border border-linha rounded-xl text-texto text-xs cursor-pointer hover:border-emerald-500 transition outline-none font-bold">
              <option value="">🏛️ Todas as casas</option>
              ${casasDisponiveisLucro.map(c => `<option value="${c.id}" ${casaFiltroLucro === c.id ? 'selected' : ''}>🏛️ ${c.nome}</option>`).join('')}
            </select>
            <button onclick="window.print()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black rounded-xl transition">
              🖨️ Imprimir / Salvar PDF
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-panel border border-linha rounded-xl p-5">
            <p class="text-xs text-mutado mb-1">Lucro Líquido Consolidado</p>
            <h3 class="text-xl md:text-2xl font-black ${lucroGeralFinalizado > 0 ? 'text-emerald-500' : lucroGeralFinalizado < 0 ? 'text-red-500' : 'text-texto'}">
              R$ ${lucroGeralFinalizado.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
            </h3>
          </div>
          <div class="bg-panel border border-linha rounded-xl p-5">
            <p class="text-xs text-mutado mb-1">Volume Total Analisado</p>
            <h3 class="text-xl md:text-2xl font-bold text-blue-500">R$ ${volumeGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h3>
          </div>

    // ================= 6. ABA DE PAGAMENTO =================
    function renderizarPagamentos(container) {
      const usuarioLogado = obterUsuarioLogado();
