      let operadorIdAlvo = '';
      if (ehAdmin) {
        operadorIdAlvo = estado.filtros.operadorId || '';
      } else {
        const opDoUser = estado.operadores.find(op => op.nome.toLowerCase() === usuarioLogado.nome.toLowerCase() || op.id === usuarioLogado.operadorId);
        if (opDoUser) operadorIdAlvo = opDoUser.id;
      }

      const dataInicio = estado.filtros.dataInicio || '';
      const dataFim = estado.filtros.dataFim || '';
      const casaFiltro = estado.filtros.casaId || '';

      const apostasPagamento = estado.apostas.filter(a => {
        const opId = a.operadorId || a.clienteId;
        if (operadorIdAlvo && opId !== operadorIdAlvo) return false;
        if (casaFiltro && a.casaId !== casaFiltro) return false;
        if (dataInicio && a.data < dataInicio) return false;
        if (dataFim && a.data > dataFim) return false;
        return true;
      });

      let resultadoLiquidoBruto = 0;
      apostasPagamento.forEach(a => {
        if (a.finalizada && a.retorno !== null) {
          resultadoLiquidoBruto += (a.retorno - a.stake);
        }
      });

      const pctDesconto = (ehAdmin && operadorIdAlvo) ? (estado.descontosOperadores[operadorIdAlvo] || 0) : 0;

                  <option value="">Selecione...</option>
                  ${estado.operadores.map(op => `<option value="${op.id}" ${operadorIdAlvo === op.id ? 'selected' : ''}>${op.nome}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs text-mutado mb-1">Desconto / Taxa (%):</label>
                <input type="number" step="0.1" min="0" max="100" id="inputDescontoValorAdmin" value="${operadorIdAlvo ? (estado.descontosOperadores[operadorIdAlvo] || 0) : 0}" class="w-full px-3 py-2 bg-input border border-linha rounded text-texto text-xs outline-none" placeholder="Ex: 10">
              </div>
              <div>
                <button onclick="salvarDescontoOperadorAdmin()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded text-xs transition">
                  Salvar Desconto para este Operador
                </button>
              </div>

          </div>
        ` : ''}

        <div class="bg-panel border border-linha rounded-xl p-4 md:p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
          <div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <h3 class="text-xs font-bold text-texto uppercase tracking-wider mb-4">📷 QR Code PIX</h3>
            <div class="bg-white p-3 rounded-xl shadow-lg mb-4 inline-block">

              </div>
            </div>
          </div>
        </div>
      `;
    }

    function trocarOperadorDescontoAdmin(opId) {
      const inputVal = document.getElementById('inputDescontoValorAdmin');
      if (inputVal) {
        inputVal.value = opId ? (estado.descontosOperadores[opId] || 0) : 0;
      }
    }

    function salvarDescontoOperadorAdmin() {
      const selectOp = document.getElementById('selectOpDescontoAdmin');
      const inputVal = document.getElementById('inputDescontoValorAdmin');
      if (!selectOp || !selectOp.value) {
        alert("Selecione um operador primeiro.");
        return;
      }
      const opId = selectOp.value;
      const desconto = parseFloat(inputVal.value) || 0;
      estado.descontosOperadores[opId] = desconto;
      salvarDadosNoLocalStorage();
      alert("Desconto salvo para este operador com sucesso!");
      renderizarAba();
    }

    function renderizarBackup(container) {
      if (!verificarSeTemPermissaoEdicao()) {
        container.innerHTML = `<div class="p-6 bg-red-500/10 border border-red-500/20 text-red-500 rounded-xl text-center">Acesso restrito a administradores.</div>`;
        return;
      }

      container.innerHTML = `

          <p class="text-xs text-mutado">Exporte ou importe todos os registros do BetControl via arquivo JSON.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-panel border border-linha rounded-xl p-6 flex flex-col justify-between">
            <div>
              <h3 class="text-sm font-bold text-texto mb-2">📥 Exportar Dados (Backup)</h3>
              <p class="text-xs text-mutado mb-4">Baixe um arquivo contendo operadores, casas, apostas e usuários do sistema.</p>
            </div>
            <button onclick="exportarBackupJSON()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition">
              Baixar Arquivo JSON
            </button>
          </div>

          <div class="bg-panel border border-linha rounded-xl p-6 flex flex-col justify-between">
            <div>
              <h3 class="text-sm font-bold text-texto mb-2">📤 Importar Dados (Restaurar)</h3>
              <p class="text-xs text-mutado mb-4">Selecione um arquivo JSON de backup válido para restaurar as informações.</p>
              <input type="file" id="inputFileBackup" accept=".json" class="w-full text-xs text-mutado file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer mb-3">
            </div>
            <button onclick="importarBackupJSON()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition">
              Restaurar Dados do Arquivo
            </button>
          </div>
        </div>
      `;
    }

    function exportarBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(estado, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `betcontrol_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarBackupJSON() {
      const fileInput = document.getElementById('inputFileBackup');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Selecione um arquivo JSON primeiro.");
        return;
      }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const dadosImportados = JSON.parse(e.target.result);
          if (dadosImportados && dadosImportados.usuarios) {
            estado = dadosImportados;
            salvarDadosNoLocalStorage();
            alert("Backup restaurado com sucesso!");
            window.location.reload();
          } else {
            alert("Arquivo de backup inválido.");
          }
        } catch (err) {
          alert("Erro ao ler o arquivo JSON.");
        }
      };
      reader.readAsText(file);
    }

                        <label class="block text-xs font-bold text-mutado mb-2">Permissões de Acesso às Abas</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="dashboard" ${permissoesAtuais.includes('dashboard') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Dashboard
                          </label>
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="volumemes" ${permissoesAtuais.includes('volumemes') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Volume Mês
                          </label>
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="operadores" ${permissoesAtuais.includes('operadores') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Operadores
                          </label>
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="casas" ${permissoesAtuais.includes('casas') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Casas
                          </label>
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="relatorios" ${permissoesAtuais.includes('relatorios') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Relatórios
                          </label>
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="lucro" ${permissoesAtuais.includes('lucro') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Lucro
                          </label>
                          <label class="flex items-center gap-2 text-xs text-mutado cursor-pointer bg-input p-2 rounded border border-linha">
                            <input type="checkbox" value="pagamentos" ${permissoesAtuais.includes('pagamentos') ? 'checked' : ''} class="perm-check-${u.id} accent-emerald-500"> Pagamento
                          </label>
                        </div>
                      </div>
                    ` : `
                      <p class="text-xs text-mutado italic">Administradores possuem acesso total irrestrito a todas as abas do sistema.</p>
                    `}
                  </div>
                ` : `
                  <div class="mt-3 flex flex-wrap items-center gap-1.5 text-xs text-mutado">
                    <span class="font-bold text-texto">Permissões ativas:</span>
                    ${u.perfil === 'editor' ? '<span class="bg-emerald-500/20 text-emerald-500 px-2 py-0.5 rounded text-[10px] font-bold">Acesso Total (Editor)</span>' : (permissoesAtuais.length === 0 ? '<span class="text-mutado">Nenhuma aba permitida</span>' : permissoesAtuais.map(p => `<span class="bg-panelAlt text-texto border border-linha px-2 py-0.5 rounded text-[10px] font-bold uppercase">${p}</span>`).join(''))}
                  </div>
                `}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    async function salvarNovoUsuario(e) {
      e.preventDefault();
      const usuarioLogado = obterUsuarioLogado();
      if (!usuarioLogado || usuarioLogado.perfil !== 'editor') {
        alert("Apenas administradores podem cadastrar novos usuários.");
        return;
      }

      const userLogin = document.getElementById('novoUserLogin').value.trim();
      const nomeVal = document.getElementById('novoUserNome').value.trim();
      const senhaVal = document.getElementById('novoUserSenha').value.trim();
      const perfilVal = document.getElementById('novoUserPerfil').value;

      if (estado.usuarios.some(u => u.usuario === userLogin)) {
        alert("Este nome de usuário já existe.");
        return;
      }

      const novoUsr = {
        id: `usr-${Date.now()}`,
        usuario: userLogin,
        nome: nomeVal,
        senha: senhaVal,
        perfil: perfilVal,
        permissoesLeitor: perfilVal === 'editor' ? [] : ['dashboard', 'volumemes', 'relatorios', 'lucro']
      };

      estado.usuarios.push(novoUsr);
      await salvarNaNuvemELocal('usuario', novoUsr);
      renderizarAba();
    }

    function habilitarEdicaoUsuario(id) {
      const u = estado.usuarios.find(item => item.id === id);
      if (u) {
        u.editandoPermissoes = true;
        renderizarAba();
      }
    }

    function cancelarEdicaoUsuario(id) {
      const u = estado.usuarios.find(item => item.id === id);
      if (u) {
        u.editandoPermissoes = false;
        renderizarAba();
      }
    }

    async function salvarEdicaoUsuario(id) {
      const u = estado.usuarios.find(item => item.id === id);
      if (!u) return;

      const inputSenha = document.getElementById(`input-senha-${id}`);
      if (inputSenha) {
        u.senha = inputSenha.value.trim();
      }

      if (u.perfil !== 'editor') {
        const checkboxes = document.querySelectorAll(`.perm-check-${id}:checked`);
        const novasPermissoes = [];
        checkboxes.forEach(cb => novasPermissoes.push(cb.value));
        u.permissoesLeitor = novasPermissoes;
      }

      u.editandoPermissoes = false;
      await salvarNaNuvemELocal('usuario', u);
      alert("Alterações salvas com sucesso!");
      renderizarAba();
    }

    async function deletarUsuario(id) {
      const usuarioLogado = obterUsuarioLogado();
      if (!usuarioLogado || usuarioLogado.perfil !== 'editor') {
        alert("Apenas administradores podem excluir usuários.");
        return;
      }

      if (confirm("Deseja excluir este usuário?")) {
        estado.usuarios = estado.usuarios.filter(u => u.id !== id);
        await deletarDaNuvemELocal('usuario', id);
        renderizarAba();
      }
    }
  </script>
</body>
</html>
